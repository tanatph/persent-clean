/* ---------- Modal: รายละเอียด + ดำเนินการ ---------- */
function mDetail() {
  const l = loc(S.openId); if (!l) return '';
  const p = prog(l);
  const role = S.view;
  const canClean = role === 'cleaner' && QUEUE.cleaner.includes(l.status);
  const reviewed = l.status === 'approved', canReview = role === 'supervisor' && (QUEUE.supervisor.includes(l.status) || reviewed) && (can('supervisor', 'approve') || can('supervisor', 'reject'));
  const canFeedback = role === 'manager' && can('manager', 'feedback');

  const zones = l.subZones.map(z => canClean
    ? `<button class="check ${z.completed ? 'on' : ''}" data-act="zone" data-zone="${z.id}"><span class="box">${z.completed ? ICONS.check : ''}</span><span>${esc(z.name)}</span></button>`
    : `<div class="check ro ${z.completed ? 'on' : 'off'}"><span class="box">${z.completed ? ICONS.check : ''}</span><span>${esc(z.name)}</span></div>`
  ).join('');

  const notes = [
    ['แม่บ้าน' + (sender(l) ? ' · ' + sender(l) : ''), l.cleanerNote], ['หัวหน้าแม่บ้าน', l.supervisorNote], ['คณะกรรมการ (แจ้งปรับปรุงล่าสุด)', l.managerNote],
  ].filter(n => n[1]).map(n => `<div class="note sm"><b class="b">${esc(n[0])}:</b> ${esc(n[1])}</div>`).join('');

  const photos = l.photos.length ? `
    <div class="sec"><h3 style="margin-bottom:8px">รูปภาพ (${l.photos.length})</h3>
      <div class="photos">${l.photos.map(photoThumb).join('')}</div></div>` : '';

  const history = l.history.length ? `
    <div class="sec"><h3 style="margin-bottom:6px">ประวัติวันนี้</h3>
      <div class="timeline">${l.history.slice().reverse().map(h => `<div><time>${esc(h.time)}</time><span><b class="b">${esc(h.user)}</b> ${esc(h.action)}</span></div>`).join('')}</div>
    </div>` : '';

  let action = '';
  if (canClean) action = `
    <div class="sec stack">
      ${l.status === 'rejected' ? `<div class="alert sm" style="margin:0">ต้องแก้ไข: ${esc(l.rejectNote)}</div>` : ''}
      <div><label class="lbl">รูปหลังทำความสะอาด (อย่างน้อย 1 รูป)</label>${photoPicker()}</div>
      <div><label class="lbl">หมายเหตุ (ถ้ามี)</label><textarea rows="2" data-act="note" placeholder="เช่น น้ำยาหมด, ก๊อกน้ำรั่ว">${esc(S.form.note || l.cleanerNote)}</textarea></div>
      <button class="btn primary block" data-act="submit" ${S.busy ? 'disabled' : ''}>ส่งรายงาน</button>
    </div>`;
  else if (canReview) action = `
    <div class="sec stack">
      ${reviewed ? '<div class="note sm">ตรวจผ่านไปแล้ว — แก้ไขผลตรวจได้ เช่น ตีกลับให้แก้ไข หรือบันทึกหมายเหตุ/รูปเพิ่มเติม</div>' : ''}
      <div><label class="lbl">แนบรูป (จำเป็นเมื่อพบจุดบกพร่อง)</label>${photoPicker()}</div>
      <div><label class="lbl">หมายเหตุ / จุดที่ต้องแก้ไข</label><textarea rows="2" data-act="note" placeholder="ระบุตำแหน่งและสิ่งที่ต้องแก้">${esc(S.form.note)}</textarea></div>
      <div class="row">
        ${can('supervisor', 'reject') ? `<button class="btn danger block" data-act="reject" ${S.busy ? 'disabled' : ''}>ตีกลับให้แก้ไข</button>` : ''}
        ${can('supervisor', 'approve') ? `<button class="btn primary block" data-act="approve" ${S.busy ? 'disabled' : ''}>${reviewed ? 'บันทึกตรวจผ่านอีกครั้ง' : 'ตรวจผ่าน (สิ้นสุดงาน)'}</button>` : ''}
      </div>
    </div>`;
  else if (canFeedback) action = `
    <div class="sec stack">
      <div class="note sm">คณะกรรมการไม่ต้องอนุมัติ — แจ้งจุดปรับปรุงได้ทุกเวลา งานไม่เปลี่ยนสถานะ หัวหน้าแม่บ้านและ Admin จะเห็นข้อเสนอแนะ</div>
      <div><label class="lbl">จุดที่ควรปรับปรุง</label><textarea rows="3" data-act="note" placeholder="ระบุตำแหน่งและสิ่งที่ควรปรับปรุง">${esc(S.form.note)}</textarea></div>
      <div><label class="lbl">แนบรูป (ไม่บังคับ)</label>${photoPicker()}</div>
      <div><label class="lbl">คะแนนความสะอาด (ไม่บังคับ · กดดาวเดิมซ้ำเพื่อล้าง)</label><div class="stars" id="stars">${starsHtml()}</div></div>
      <button class="btn primary block" data-act="feedback" ${S.busy ? 'disabled' : ''}>แจ้งจุดปรับปรุง</button>
    </div>`;
  else if (role !== 'admin') action = `<div class="sec sm muted">${role === 'manager' ? 'บทบาทนี้ถูกปิดสิทธิ์การแจ้งจุดปรับปรุง' : `ขั้นตอนนี้ไม่ต้องดำเนินการโดย${ROLES[role].name} (${STATUS[l.status].t})`}</div>`;

  return `

  userReset:   userAsk([], { tone: 'warn', title: 'ออกรหัสผ่านชั่วคราวใหม่?', text: 'รหัสเดิมจะใช้ไม่ได้ทันที', ok: 'ออกรหัสใหม่' }, 'apiResetUserPassword', ''),
  userDel:     userAsk([], { tone: 'danger', title: 'ลบบัญชีนี้ถาวร?', text: 'ลบแล้วกู้คืนไม่ได้ และที่นั่งจะว่างให้คนอื่น', ok: 'ลบ' }, 'apiDeleteUser', 'ลบแล้ว'),
};
/* ให้เบราว์เซอร์จำรหัสผ่านเอง (Credential Management API) — รหัสผ่านไม่ถูกเก็บในหน้าเว็บหรือ localStorage · เบราว์เซอร์ที่ไม่รองรับจะใช้ autocomplete ปกติของฟอร์ม */
function saveBrowserLogin(id, pw, name, on) {
  try {
    if (!window.PasswordCredential || !navigator.credentials) return;
    if (on) navigator.credentials.store(new PasswordCredential({ id, password: pw, name: name || id })).catch(() => {});
  } catch (e) {}
}
async function doLogin(form) {
  const btn = $('button[type=submit]', form), err = $('#loginErr');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  /* @dev:start */const ip = '203.0.113.10';/* @dev:end */
  /* @prod:start
  let ip = '';
  try { ip = (await Promise.race([fetch('https://api.ipify.org?format=json').then(r => r.json()), new Promise((_, r) => setTimeout(r, 1500))])).ip; } catch (e) {}
  @prod:end */
  try {
    const remember = !!form.rm.checked;
    S.auth = await api('apiLoginAuto', form.u.value.trim(), form.p.value, ip, remember);
    // "จดจำฉัน": จำชื่อผู้ใช้ + เก็บ session ไว้ในเครื่อง (localStorage) · ไม่เลือก = เก็บเฉพาะแท็บนี้ (sessionStorage) และลบชื่อที่จำไว้
    S.auth.remember = remember && !!S.auth.remember;
    store.del('auth'); store.set('auth', S.auth, !S.auth.remember);
    try { if (remember) localStorage.setItem('rememberUser', form.u.value.trim()); else localStorage.removeItem('rememberUser'); } catch (e) {}
    saveBrowserLogin(form.u.value.trim(), form.p.value, S.auth.displayName, remember);
    await load(true);
    goRole(S.auth.role);
  } catch (e) {
    err.style.display = 'block'; err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}

function logout(silent) {
  resetStock();
  try { if (navigator.credentials && navigator.credentials.preventSilentAccess) navigator.credentials.preventSilentAccess(); } catch (e) {}
  if (S.auth && !silent) api('apiLogout', S.auth.token).catch(() => {});
  S.auth = null; store.del('auth');
  // ล้างข้อมูลของผู้ใช้เดิมออกจากหน่วยความจำ/เครื่อง
  try { sessionStorage.removeItem(SNAP_KEY); localStorage.removeItem('locsSnap'); } catch (e) {}
  Object.assign(S, { locs: [], hist: null, users: null, limits: null, logs: null, permLog: null, area: null, cleanerForms: {} });
  ensureLocalAuth();
  S.view = 'home'; S.modal = null; S.form = freshForm(); renderModal(); render();
}

/* locId ระบุ = อัปโหลดจากการ์ดแม่บ้าน (เก็บใน cfForm) · ไม่ระบุ = อัปโหลดจากโมดัลตรวจสอบ (เก็บใน S.form) */
async function addPhotos(locId, files) {
  const reply = /^r\d+$/.test(locId);
  const l = loc(reply ? locId.slice(1) : locId) || loc(S.openId);
  const f = locId ? cfForm(locId) : S.form;
  const room = MAX_PENDING_PHOTOS - f.photos.length - f.uploading;
  const list = [...files].slice(0, room);
  const kind = reply ? 'fix' : locId ? 'report' : 'review';
  f.uploading += list.length; refreshPending(locId);
  await Promise.all(list.map(async file => {
    try {
      const dataUrl = await compress(file);
      const up = await api('apiUploadPhoto', S.auth?.token, { dataUrl, locationId: l.id, kind });
      f.photos.push({ id: up.id, preview: dataUrl });
    } catch (e) { toast('อัปโหลดไม่สำเร็จ: ' + e.message, true); }
    finally { f.uploading--; refreshPending(locId); }
  }));
}
function refreshPending(locId) {
  const el = $(locId ? '#pending-' + locId : '#pending');
  if (el) el.innerHTML = pendingHtml(locId);
}

function toggleZone(locId, zoneId) {
  const l = loc(locId), z = l.subZones.find(x => x.id === zoneId);
  z.completed = !z.completed;                     // อัปเดตทันที แล้วค่อยบันทึก
  const el = $(`[data-zone="${zoneId}"]`);
  el.classList.toggle('on', z.completed); $('.box', el).innerHTML = z.completed ? ICONS.check : '';
  render();
  const want = z.completed;
  // เซิร์ฟเวอร์ตอบตามลำดับที่ส่ง — ห้ามเอาคำตอบมาทับ subZones ในเครื่อง ไม่งั้นข้อที่ติ๊กต่อกันเร็ว ๆ จะหลุด
  queue(() => api('apiToggleZone', S.auth?.token, l.id, zoneId, want).then(r => { l.lastUpdated = r.lastUpdated; }).catch(e => {
    z.completed = !want; toast(e.message, true); render();
    if (/สถานะงานเปลี่ยน|ส่งแล้ว|ตรวจผ่านแล้ว/.test(e.message)) load(true);
  }));
}

async function submitCleaner(locId) {
  const l = loc(locId), p = prog(l), f = cfForm(locId);
  if (f.busy || $('#sa')) return;
  if (f.uploading) return toast('รอให้อัปโหลดรูปเสร็จก่อน', true);
  if (can('cleaner', 'photo') && !f.photos.length && !l.photos.some(x => x.kind === 'report')) return toast('กรุณาแนบรูปอย่างน้อย 1 รูป', true);
  const miss = p.t - p.d;
  const edit = l.status === 'cleaner_done';
  if (!await askConfirm({ tone: miss ? 'warn' : 'ask', title: edit ? 'ยืนยันบันทึกการแก้ไข?' : 'ยืนยันส่งรายงาน?', text: `${l.area}\n` + (miss ? `ยังไม่ได้ติ๊ก ${miss} จุด ต้องการ${edit ? 'บันทึก' : 'ส่ง'}เลยหรือไม่?` : edit ? 'บันทึกรายงานที่แก้ไขให้หัวหน้าตรวจ' : 'ทำครบทุกจุดแล้ว ส่งให้หัวหน้าตรวจ'), ok: edit ? 'บันทึก' : 'ส่งรายงาน' })) return;
  if (f.busy) return;
  f.busy = true; render();
  try {
    const updated = await queue(() => api('apiCleanerSubmit', S.auth?.token, l.id, f.note, f.photos.map(x => ({ id: x.id }))));
    upsert(updated);
    delete S.cleanerForms[Number(locId)];
    S.area = null; render(); window.scrollTo(0, 0);
    await askDone({ title: edit ? 'บันทึกการแก้ไขแล้ว' : 'ส่งรายงานสำเร็จ', text: edit ? `${l.area}\nรายงานที่แก้ไขรอหัวหน้าแม่บ้านตรวจ` : `${l.area}\nส่งให้หัวหน้าแม่บ้านตรวจแล้ว` });
  } catch (e) {
    f.busy = false; toast(e.message, true); render();
    if (/สถานะงานเปลี่ยน/.test(e.message)) load(true);
  }
}

async function review(decision) {
  const l = loc(S.openId), f = S.form;
  if (S.busy || $('#sa')) return;
  if (f.uploading) return toast('รอให้อัปโหลดรูปเสร็จก่อน', true);
  if (decision === 'reject' && !f.note.trim()) { toast('กรุณาระบุจุดที่ต้องแก้ไข', true); return $('textarea[data-act=note]')?.focus(); }
  const rej = decision === 'reject';
  if (!await askConfirm({ tone: rej ? 'danger' : 'ask', title: rej ? (l.status === 'approved' ? 'ยกเลิกผลตรวจผ่านและตีกลับ?' : 'ยืนยันตีกลับให้แก้ไข?') : (l.status === 'approved' ? 'บันทึกผลตรวจผ่านอีกครั้ง?' : 'ยืนยันตรวจผ่าน?'),
    text: `${l.area}\n` + (rej ? (f.photos.length ? 'แม่บ้านจะต้องแก้ไขและส่งใหม่' : 'ยังไม่ได้แนบรูปจุดบกพร่อง — แม่บ้านจะต้องแก้ไขและส่งใหม่') : 'ตรวจผ่านแล้วงานนี้สิ้นสุด ไม่ต้องตรวจซ้ำ'),
    ok: rej ? 'ตีกลับ' : 'ตรวจผ่าน' })) return;
  await act(() => api('apiReview', S.auth.token, l.id, decision, f.note, f.photos.map(x => ({ id: x.id }))),
    rej ? 'ตีกลับให้แก้ไขแล้ว' : 'ตรวจผ่านสำเร็จ');
}

/* คณะกรรมการ: แจ้งจุดปรับปรุง (ไม่ใช่การอนุมัติ — ไม่เปลี่ยนสถานะงาน) */
async function submitFeedback() {
  const l = loc(S.openId), f = S.form;
  if (S.busy || $('#sa')) return;
  if (f.uploading) return toast('รอให้อัปโหลดรูปเสร็จก่อน', true);
  if (!f.note.trim()) { toast('กรุณาระบุจุดที่ควรปรับปรุง', true); return $('textarea[data-act=note]')?.focus(); }
  if (!await askConfirm({ tone: 'ask', title: 'ยืนยันแจ้งจุดปรับปรุง?', text: `${l.area}\nบันทึกข้อเสนอแนะ${f.rating ? ` · ให้ ${f.rating} ดาว` : ''} (ไม่กระทบสถานะงาน)`, ok: 'แจ้งปรับปรุง' })) return;
  await act(() => api('apiFeedback', S.auth.token, l.id, f.note, f.rating, f.photos.map(x => ({ id: x.id }))), 'แจ้งจุดปรับปรุงแล้ว');
}

async function act(fn, okMsg) {
  if (S.busy) return;
  S.busy = true; renderModal();
  try {
    const updated = await fn();
    upsert(updated); S.busy = false; closeModal(); render();
    await askDone({ title: okMsg, text: updated.area });
  } catch (e) {
    S.busy = false; renderModal(); toast(e.message, true);
    if (/สถานะงานเปลี่ยน/.test(e.message)) load(true);
  }
}

/* =========================================================
   Event delegation
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'closeOv') { if (e.target === t) closeModal(); return; }
  if (t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT')) return;
  ({
    home: () => { if (S.auth && S.auth.role !== 'admin') goRole(S.auth.role); else { S.view = 'home'; render(); } },
    role: () => goRole(t.dataset.role),
    refresh: () => { load(); if (S.view === 'admin') loadAdmin(); },
    logout: () => logout(),
    tab: () => { S.tab = t.dataset.tab; render(); },
    area: () => { S.area = Number(t.dataset.id); render(); window.scrollTo(0, 0); },
    back: () => { S.area = null; render(); window.scrollTo(0, 0); },
    open: () => { S.openId = Number(t.dataset.id); S.form = freshForm(); openModal('detail'); },
    close: closeModal,
    zone: () => toggleZone(t.dataset.id, t.dataset.zone),
    rmPhoto: () => { const id = t.dataset.id; const f = id ? cfForm(id) : S.form; f.photos.splice(Number(t.dataset.i), 1); refreshPending(id); },
    star: () => { const v = Number(t.dataset.v); S.form.rating = S.form.rating === v ? 0 : v; $('#stars').innerHTML = starsHtml(); },
    feedback: () => submitFeedback(),
    replyToggle: () => { S.replyOpen[t.dataset.id] = !S.replyOpen[t.dataset.id]; render(); },
    replySend: () => submitReply(t.dataset.id),
    report: () => downloadReport(),
    submit: () => submitCleaner(t.dataset.id),
    approve: () => review('approve'),
    reject: () => review('reject'),
    register: async () => { try { S.regInfo = await api('apiRegInfo'); } catch (e) { S.regInfo = null; } S.regRole = null; S.regDraft = {}; S.regDir = ''; S.regFresh = true; openModal('register'); S.regFresh = false; },
    regRole: () => { S.regRole = t.dataset.role; S.regDir = 'fwd'; renderModal(); },
    regBack: () => { const fm = $('#registerForm'); if (fm) S.regDraft = { code: fm.code?.value, n: fm.n.value, ph: fm.ph.value, u: fm.u.value }; S.regRole = null; S.regDir = 'back'; renderModal(); },
    pwToggle: () => {
      const inp = t.parentElement.querySelector('input'), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; t.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
      t.setAttribute('aria-pressed', show); t.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
    },
    chpw: () => openModal('chpw'),
    userCreate: () => openModal('userCreate'),
    copyPw: () => { navigator.clipboard?.writeText(S.tempPw.password).then(() => toast('คัดลอกแล้ว')).catch(() => toast('คัดลอกไม่ได้ กรุณาจดรหัสเอง', true)); },
    ...Object.fromEntries(Object.entries(USER_ACTIONS).map(([k, f]) => [k, () => f(t.dataset.u)])),
    adminTab: () => { S.adminTab = t.dataset.tab; render(); loadAdmin(); },
    dfPeriod: () => { S.dfPeriod = t.dataset.p; S.dfOffset = 0; render(); },
    dfPrev: () => { S.dfOffset--; render(); },
    dfNext: () => { if (S.dfOffset < 0) { S.dfOffset++; render(); } },
    dfNow: () => { S.dfOffset = 0; render(); },
    stock: () => openStock(),
    stockBack: () => { S.view = (S.stockFrom && S.stockFrom !== 'stock') ? S.stockFrom : (S.auth ? S.auth.role : 'home'); render(); },
  dashCfg: () => openModal('dashCfg'),
  dashToggle: () => { const l = dashLayout(), k = t.dataset.k; l.hidden = l.hidden.includes(k) ? l.hidden.filter(x => x !== k) : [...l.hidden, k]; saveDashLayout(l); render(); renderModal(); },
  dashMove: () => { const l = dashLayout(), k = t.dataset.k, i = l.order.indexOf(k), j = i + Number(t.dataset.d); if (j < 0 || j >= l.order.length) return; l.order.splice(i, 1); l.order.splice(j, 0, k); saveDashLayout(l); render(); renderModal(); },
  dashReset: () => { saveDashLayout({ order: [], hidden: [] }); render(); renderModal(); },
    pplRole: () => { S.pplRole = t.dataset.r; render(); },
    fillLogin: () => { const fm = $('#loginForm'); fm.u.value = t.dataset.u; fm.p.value = t.dataset.p; fm.p.focus(); },
    userEdit: () => { S.userEdit = (S.users || []).find(x => x.username === t.dataset.u) || null; if (S.userEdit) openModal('userEdit'); },
    perm: () => setPerm(t.dataset.role, t.dataset.key, !(((S.perms || {})[t.dataset.role] || {})[t.dataset.key] !== false)),
    permReset: async () => {
      if (!await askConfirm({ tone: 'warn', title: 'คืนค่าเริ่มต้นทุกสิทธิ์?', text: 'ทุกบทบาทจะกลับมาทำได้ทุกอย่างตามค่าเริ่มต้น', ok: 'คืนค่าเริ่มต้น' })) return;
      try { await api('apiResetPerms', S.auth.token); await loadAdmin(); toast('คืนค่าเริ่มต้นแล้ว'); } catch (err) { toast(err.message, true); }
    },
    resetToday: async () => {
      if (!await askConfirm({ tone: 'danger', title: 'รีเซ็ตสถานะวันนี้?', text: 'ล้างสถานะทุกพื้นที่กลับเป็น "รอทำความสะอาด"\nการกระทำนี้ย้อนกลับไม่ได้', ok: 'รีเซ็ต' })) return;
      try { await api('apiResetToday', S.auth.token); await load(true); toast('รีเซ็ตแล้ว'); } catch (err) { toast(err.message, true); }
    },
    repairLocs: async () => {
      if (!await askConfirm({ title: 'ซ่อมข้อมูลพื้นที่?', text: 'ตรวจทุกพื้นที่ แถวที่ข้อมูลเสีย (เช่น ไม่มีรายการจุดย่อย) จะถูกตั้งใหม่เป็น "รอทำความสะอาด"\nพื้นที่ที่ปกติจะไม่ถูกแตะ', ok: 'ตรวจและซ่อม' })) return;
      try { const n = await api('apiRepairLocations', S.auth.token); await load(true); toast(n ? `ซ่อมแล้ว ${n} พื้นที่` : 'ข้อมูลทุกพื้นที่ปกติ ไม่ต้องซ่อม'); } catch (err) { toast(err.message, true); }
    },
  })[a]?.();
});
document.addEventListener('input', e => {
  const a = e.target.dataset.act;
  if (a === 'note') { const id = e.target.dataset.id; if (id) cfForm(id).note = e.target.value; else S.form.note = e.target.value; }
  if (a === 'phone') e.target.value = fmtPhone(e.target.value);   // ตัวเลขเท่านั้น จัดเป็น 000-000-0000
  if (a === 'logFilter') { S.logFilter = e.target.value; render(); }
  if (a === 'dfArea') { S.dfArea = e.target.value; render(); }
  if (a === 'search') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('[data-act=search]'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if (a === 'pick' && e.target.files.length) { addPhotos(e.target.dataset.id, e.target.files); e.target.value = ''; }
});
document.addEventListener('submit', e => {
  const h = { loginForm: doLogin, registerForm: submitRegister, chpwForm: submitChpw, userForm: submitUserCreate, userEditForm: submitUserEdit }[e.target.id];
  if (h) { e.preventDefault(); h(e.target); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });

// รีเฟรชอัตโนมัติทุก 60 วินาที (เมื่อไม่ได้เปิดหน้าต่างรายละเอียดอยู่)
setInterval(() => {
  if (S.auth && S.view !== 'home' && !S.modal && !document.hidden) { load(true); if (S.view === 'admin') loadAdmin(); }
}, 60000);

try { localStorage.removeItem('locsSnap'); } catch (e) {}   // สำเนาแบบเก่า (localStorage) จากเวอร์ชันก่อน
/* @dev:start */ensureLocalAuth();
/* ฝังใน present.html: mockup.html?embed=1&role=cleaner|supervisor|manager|admin|home&tab=…&open=รหัสพื้นที่ — เปิดฉากตัวอย่างโดยไม่ต้องล็อกอิน */
const EMB = new URLSearchParams(location.search);
if (EMB.has('embed')) document.documentElement.classList.add('emb-mode');
async function embedScene() {
  const role = EMB.get('role'), tab = EMB.get('tab'), open = Number(EMB.get('open')) || 0;
  if (role === 'home') { S.auth = null; store.del('auth'); S.view = 'home'; S.locs = []; S.loaded = true; render(); return; }
  await devSwitchRole(role);
  if (tab) { S.adminTab = role === 'admin' ? tab : S.adminTab; if (role !== 'admin') S.tab = tab; render(); if (role === 'admin') loadAdmin(); }
  if (open) { S.openId = open; openModal('detail'); }
  if (EMB.get('stock')) openStock();
}
if (EMB.get('role')) embedScene();
else load(true).then(() => S.auth && goRole(S.auth.role));/* @dev:end */

@prod:end */
