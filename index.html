<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจความสะอาด ศูนย์กีฬาสิรินธร มศว<!-- @dev:start --> (Mockup)<!-- @dev:end --></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://sport.swu.ac.th">
<link rel="preconnect" href="https://vxfozsxudrkxrjphttxm.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     SWU Design System — tokens (Tier A)
     Source: .swu/design-system/ · see /Design.md for the
     project-level mapping notes.
     ========================================================== */
  :root{
    /* L1 primitives — SWU Design System v1.0, copied verbatim from .swu/design-system/dist/tokens.css */
    --neutral-50:#F7F7F7; --neutral-100:#EDEDED; --neutral-200:#D9D9D9; --neutral-300:#BDBDBD; --neutral-400:#8F8F8F; --neutral-600:#616161; --neutral-700:#4D4D4D; --neutral-800:#383838; --neutral-900:#262626; --neutral-950:#171717; --swu-purple-50:#F8F5FF; --swu-purple-100:#EFE6FF; --swu-purple-200:#E1CFFF; --swu-purple-500:#A16AE7; --swu-purple-600:#814DC0; --swu-purple-700:#6B3DA1; --swu-purple-800:#542F80; --swu-purple-900:#3F2261; --swu-red-50:#FFF4F3; --swu-red-100:#FFE4E1; --swu-red-600:#BC1723; --swu-red-700:#9D0517; --swu-red-800:#800311; --green-50:#F0FAF6; --green-100:#CCF5E5; --green-600:#00CE7C; --green-700:#00B56D; --green-800:#009157; --green-900:#006E42; --teal-50:#F4FBFB; --teal-100:#EAF7F8; --teal-200:#D2EFEF; --teal-800:#5F9294; --teal-900:#497072; --blue-50:#E8F0FC; --blue-100:#D1E1F9; --blue-600:#1E60D0; --blue-700:#1850AB; --blue-800:#143F85; --yellow-50:#FFFBF0; --yellow-100:#FFF7D6; --yellow-400:#FFDB5C; --yellow-600:#FFD340; --yellow-700:#D9B336; --yellow-900:#8C7423; --yellow-950:#66551A;

    --font-thai:"Noto Sans Thai", sans-serif;
    --focus-ring: rgba(129,77,192,.18);
    --focus-ring-red: rgba(188,23,35,.18);

    /* radius scale (03-spacing-shadows-radius.md Part 3) */
    --r-sm:4px; --r-md:8px; --r-lg:14px; --r-xl:18px; --r-2xl:24px; --r-pill:999px;
    /* spacing scale (4px base) */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
    /* shadow scale */
    --shadow-lg:0 8px 24px rgba(38,41,44,.08);
    --shadow-xl:0 16px 40px rgba(38,41,44,.10);

    /* L2 semantic aliases — app-level names kept stable for the JS layer,
       values resolve to DS primitives only (no raw hex below this line) */
    --bg: var(--neutral-50);
    --card: #fff;
    --line: var(--neutral-100);
    --text: var(--neutral-900);
    --muted: var(--neutral-600);
    --brand: var(--swu-purple-600);
    --brand-2: var(--swu-purple-50);
    --gray-bg: var(--neutral-100);
    --green: var(--green-800);   /* success */
    --violet: var(--teal-800);
    --blue: var(--blue-600);           /* info */
    --red: var(--swu-red-600);             /* danger */
    --amber: var(--yellow-600);        /* warn / rating */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-thai);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:none;width:100%;margin:0 auto;padding:16px}
  @media(min-width:1024px){.wrap{padding:20px 40px}}
  @media(min-width:1600px){.wrap{padding:24px 64px}}
  .muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .stack>*+*{margin-top:12px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  @media(min-width:1024px){.grid{gap:16px}}
  h1{font-size:17px;font-weight:700} h2{font-size:20px;font-weight:700} h3{font-size:15px;font-weight:700}

  /* mockup banner — DS Toast Warning tokens (yellow-50 / yellow-950 text) */
  /* @dev:start */.emb-mode .mock-banner,.emb-mode #devRole{display:none!important}/* @dev:end */
/* @dev:start */.devrole{position:fixed;z-index:60;right:12px;bottom:84px;background:#fff;border:2px solid var(--swu-purple-700);border-radius:var(--r-lg);box-shadow:0 8px 24px rgb(0 0 0/.3);font-size:13px;user-select:none;touch-action:none;opacity:1}.devrole .dh{cursor:grab;background:var(--swu-purple-700);color:#fff;padding:5px 10px;border-radius:calc(var(--r-lg) - 2px) calc(var(--r-lg) - 2px) 0 0;font-weight:700;display:flex;justify-content:space-between;gap:12px}.devrole.drag .dh{cursor:grabbing}.devrole .db{display:flex;gap:6px;padding:8px;background:#fff;border-radius:0 0 var(--r-lg) var(--r-lg)}.devrole .db button{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--r-md);border:1px solid var(--swu-purple-700);background:#fff;color:var(--swu-purple-700);font-weight:700;white-space:nowrap}.devrole .db button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.devrole .db button.on{background:var(--swu-purple-700);color:#fff}.devrole.min .db{display:none}@media(max-width:700px){.devrole .db{flex-wrap:wrap;max-width:260px}}/* @dev:end */
/* @dev:start */.mock-banner{background:var(--yellow-50);color:var(--yellow-950);font-size:12px;font-weight:400;text-align:center;padding:7px 10px;border-bottom:1px solid var(--yellow-100)}/* @dev:end */

  /* top bar — brand surface (swu-purple-600), text-on-brand per DS-#052/#054 */
  .top{background:var(--brand);border-bottom:1px solid var(--swu-purple-700);position:sticky;top:0;z-index:10}
  .top .wrap{padding-top:14px;padding-bottom:14px}
  .top h1{color:var(--neutral-50)}
  .top #subtitle{color:var(--swu-purple-100);display:flex;align-items:center;gap:5px}
  .top #subtitle .spark{color:var(--yellow-400)}
  .logo{display:flex;align-items:center;gap:10px}
  .logo i{width:36px;height:36px;border-radius:var(--r-md);background:var(--swu-purple-700);display:grid;place-items:center;color:var(--neutral-50);font-style:normal;font-weight:700}
  .logo-mark{width:132px;height:52px;flex:none;background:url(https://vxfozsxudrkxrjphttxm.supabase.co/storage/v1/object/public/Photo/Thai_White01_0.png) -1.5px -5.4px/136px 61.7px no-repeat}
  .top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .logo{min-width:0}
  .actions{display:flex;gap:6px;align-items:center}
  .top .btn.sm.ghost{background:var(--swu-purple-700);color:var(--neutral-50)}
  .top .btn.sm.ghost:hover{background:var(--swu-purple-800)}
  .top .actions .btn{white-space:nowrap}
  .top .logo{min-width:0}
  .top .actions .btn.sk svg{width:20px;height:20px;flex:none}
  .top .actions .bt-s{display:none}
  /* มือถือ: ปุ่มบนหัวเหลือไอคอน (เบิกอุปกรณ์ = ไอคอน + ป้ายสั้นใต้ไอคอน) ให้ชื่อบทบาท/วันที่ไม่ถูกบีบ */
  @media (max-width:600px){
    .top .actions{gap:4px}
    .top .actions .btn.sm{padding-left:9px;padding-right:9px}
    .top .actions .bt,.top .actions .bt-l{display:none}
    .top .actions .bt-s{display:inline}
    .top .actions .btn.sk{flex-direction:column;gap:1px;font-size:11px;line-height:1.15;padding-top:4px;padding-bottom:4px}
  }

  /* ── buttons — fkt-button.md · base = Secondary(Outline), M 40px / S 32px, no shadow ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 var(--s4);border-radius:var(--r-md);font-weight:700;font-size:14px;background:#fff;border:1px solid var(--swu-purple-600);color:var(--swu-purple-600);transition:150ms cubic-bezier(.2,.7,.2,1)}
  .btn:hover{background:var(--swu-purple-50);border-color:var(--swu-purple-700);color:var(--swu-purple-700)}
  .btn:active{background:var(--swu-purple-100);border-color:var(--swu-purple-800);color:var(--swu-purple-800)}
  .btn:disabled{background:var(--neutral-50);border-color:var(--neutral-200);color:var(--neutral-300);pointer-events:none}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}

  .btn.primary{background:var(--swu-purple-600);border-color:var(--swu-purple-600);color:var(--neutral-50)}
  .btn.primary:hover{background:var(--swu-purple-700);border-color:var(--swu-purple-700)}
  .btn.primary:active{background:var(--swu-purple-800);border-color:var(--swu-purple-800)}
  .btn.primary:disabled{background:var(--neutral-50);border-color:var(--neutral-200);color:var(--neutral-300)}

  .btn.danger{background:var(--swu-red-600);border-color:var(--swu-red-600);color:var(--neutral-50)}
  .btn.danger:hover{background:var(--swu-red-700);border-color:var(--swu-red-700)}
  .btn.danger:active{background:var(--swu-red-800);border-color:var(--swu-red-800)}
  .btn.danger:focus-visible{box-shadow:0 0 0 4px var(--focus-ring-red)}

  .btn.ghost{background:var(--swu-purple-50);border-color:transparent;color:var(--swu-purple-600)}
  .btn.ghost:hover{background:var(--swu-purple-100);color:var(--swu-purple-700)}
  .btn.ghost:active{background:var(--swu-purple-200);color:var(--swu-purple-800)}
  .btn.ghost.danger{background:var(--swu-red-50);color:var(--swu-red-700)}
  .btn.ghost.danger:hover{background:var(--swu-red-100)}

  .btn.sm{height:32px;padding:0 var(--s3);font-size:12px;border-radius:var(--r-sm)}
  .btn.block{width:100%}

  /* ── cards — fkt-card.md · r-xl 18px, no shadow at rest, border family-100@60% ── */
  .card{background:var(--card);border:1px solid rgba(230,233,235,.6);border-radius:var(--r-xl);padding:var(--s4);text-align:left;width:100%;display:block;transition:150ms cubic-bezier(.2,.7,.2,1)}
  button.card{cursor:pointer}
  button.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .role{display:flex;gap:14px;align-items:flex-start;padding:var(--s5)}
  .role .n{width:40px;height:40px;border-radius:var(--r-md);background:var(--brand-2);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}

  /* home / role picker — 2-col grid, per-role tinted tile + border (screenshot ref) */
  .role-grid{display:grid;gap:var(--s5);grid-template-columns:1fr;text-align:left;margin-top:var(--s2)}
  @media(min-width:640px){.role-grid{grid-template-columns:1fr 1fr}}
  .role-card{display:flex;gap:16px;align-items:flex-start;padding:var(--s5);border-width:1.5px}
  .role-card-icon{width:52px;height:52px;border-radius:var(--r-lg);display:grid;place-items:center;flex:none;transition:150ms cubic-bezier(.2,.7,.2,1)}
  .role-card-icon svg{width:26px;height:26px}
  .role-card h3{font-size:18px;margin-bottom:4px}

  .role-card--cleaner{border-color:var(--swu-purple-100)}
  .role-card--cleaner .role-card-icon{background:var(--swu-purple-50);color:var(--swu-purple-600)}
  .role-card--cleaner:hover{border-color:var(--swu-purple-600)}
  .role-card--cleaner:hover .role-card-icon{background:var(--swu-purple-600);color:var(--neutral-50)}

  .role-card--supervisor{border-color:var(--teal-200)}
  .role-card--supervisor .role-card-icon{background:var(--teal-100);color:var(--teal-800)}
  .role-card--supervisor:hover{border-color:var(--teal-800)}
  .role-card--supervisor:hover .role-card-icon{background:var(--teal-800);color:var(--neutral-50)}

  .role-card--manager{border-color:var(--blue-100)}
  .role-card--manager .role-card-icon{background:var(--blue-50);color:var(--blue-600)}
  .role-card--manager:hover{border-color:var(--blue-600)}
  .role-card--manager:hover .role-card-icon{background:var(--blue-600);color:var(--neutral-50)}

  .role-card--admin{background:var(--neutral-900);border-color:var(--neutral-700)}
  .role-card--admin .role-card-icon{background:var(--neutral-800);color:var(--yellow-400)}
  .role-card--admin:hover{border-color:var(--yellow-400)}
  .role-card--admin h3{color:var(--neutral-50)}
  .role-card--admin .muted{color:var(--neutral-400)}

  /* ── badges/chips — fkt-badge-chip.md · Light variant, M 24px, pill radius ── */
  .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700;white-space:nowrap}
  .c-gray{background:var(--neutral-100);color:var(--neutral-900)}
  .c-blue{background:var(--blue-50);color:var(--blue-800)}
  .c-violet{background:var(--teal-100);color:var(--teal-900)}
  .c-green{background:var(--green-50);color:var(--green-900)}
  .c-red{background:var(--swu-red-50);color:var(--swu-red-800)}

  .bar{height:6px;background:var(--neutral-100);border-radius:var(--r-pill);overflow:hidden;margin:12px 0 8px}
  .bar i{display:block;height:100%;background:var(--yellow-600);border-radius:var(--r-pill)}
  .bar i.full{background:var(--green-600)}
  /* semantic alert box — DS-#096: red-50 bg + red-700 text */
  .alert{background:var(--swu-red-50);color:var(--swu-red-700);border-radius:var(--r-md);padding:8px 12px;margin-top:10px;font-size:13px}
  .note{background:var(--neutral-50);border-radius:var(--r-md);padding:8px 12px;white-space:pre-line}

  /* ── tabs — nav item = Regular 400 at every state (DS-#118), state via bg+color only ── */
  .tabs{display:inline-flex;background:var(--neutral-100);border-radius:var(--r-md);padding:3px}
  .tabs button{padding:7px 14px;border-radius:var(--r-sm);font-size:14px;font-weight:400;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--text);font-weight:400;box-shadow:0 1px 2px rgba(38,41,44,.06)}

  /* ── inputs — fkt-input-field.md · r-md 8px, focus = border only, no glow ── */
  input[type=text],input[type=password],input[type=tel],textarea,select{width:100%;height:40px;border:1px solid var(--neutral-100);border-radius:var(--r-md);padding:0 var(--s3);background:#fff;outline:none;font-size:14px;transition:150ms cubic-bezier(.2,.7,.2,1)}
  textarea{height:auto;min-height:80px;padding:10px var(--s3);line-height:1.6}
  input::placeholder,textarea::placeholder{color:var(--neutral-400)}
  input:focus,textarea:focus,select:focus{border:1.5px solid var(--swu-purple-600)}
  label.lbl{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}

  /* checklist — checkbox radius r-sm, checked = brand (selectable state) */
  .check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--neutral-100);border-radius:var(--r-md);width:100%;text-align:left;background:#fff;transition:150ms cubic-bezier(.2,.7,.2,1)}
  .check+.check{margin-top:6px}
  .box{width:20px;height:20px;border-radius:var(--r-sm);border:1.5px solid var(--neutral-200);flex:none;display:grid;place-items:center;color:var(--neutral-50)}
  .check.on .box{background:var(--swu-purple-600);border-color:var(--swu-purple-600)}
  .check.on span{color:var(--muted);text-decoration:line-through}
  .check.ro{cursor:default}
  .check.ro.off .box{border-color:var(--swu-red-600)}

  /* photos */
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;background:var(--neutral-100);display:block}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .tag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--r-sm);background:rgba(22,23,25,.6);color:var(--neutral-50)}
  .ph .x{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:var(--r-pill);background:rgba(22,23,25,.65);color:var(--neutral-50);display:grid;place-items:center}
  .add{border:1.5px dashed var(--neutral-200);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}
  .add input{display:none}

  .stars button{font-size:28px;color:var(--neutral-200);padding:0 2px;line-height:1}
  .stars button.on{color:var(--yellow-600)}

  /* ── modal — fkt-modal.md · r-2xl 24px, shadow-xl, backdrop neutral-950@45% ── */
  .ov{position:fixed;inset:0;background:rgba(22,23,25,.45);z-index:400;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--r-2xl) var(--r-2xl) 0 0;padding:var(--s5) var(--s6);box-shadow:var(--shadow-xl);z-index:500;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:var(--r-2xl)}}
  /* การ์ดลงทะเบียน: เด้งขึ้นตอนเปิด · เปลี่ยนขั้นเลื่อนซ้าย/ขวา · ลงทะเบียนเสร็จสไลด์ขึ้นแล้วหายไป */
  .ov.pop{animation:ovIn .25s ease-out}
  .sheet.pop{animation:sheetUp .38s cubic-bezier(.2,.8,.2,1)}
  .rg-step.fwd{animation:stepFwd .3s cubic-bezier(.2,.8,.2,1)}
  .rg-step.back{animation:stepBack .3s cubic-bezier(.2,.8,.2,1)}
  .ov.leave{animation:ovOut .45s ease-in forwards;pointer-events:none}
  .sheet.leave{animation:sheetAway .45s cubic-bezier(.5,0,.9,.4) forwards;pointer-events:none}
  @keyframes ovIn{from{opacity:0}}
  @keyframes sheetUp{from{opacity:0;transform:translateY(48px)}}
  @keyframes stepFwd{from{opacity:0;transform:translateX(28px)}}
  @keyframes stepBack{from{opacity:0;transform:translateX(-28px)}}
  @keyframes ovOut{to{opacity:0}}
  @keyframes sheetAway{to{opacity:0;transform:translateY(-100vh)}}
  @media(prefers-reduced-motion:reduce){.ov.pop,.sheet.pop,.rg-step,.ov.leave,.sheet.leave{animation:none!important}}
  .sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .x-close{width:32px;height:32px;border-radius:var(--r-pill);background:var(--neutral-100);color:var(--neutral-600);display:grid;place-items:center;flex:none;transition:150ms}
  .x-close:hover{color:var(--neutral-900)}
  .timeline div{display:flex;gap:10px;font-size:13px;padding:4px 0}
  .timeline time{color:var(--muted);width:44px;flex:none}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
  .stat .v{font-size:26px;font-weight:700;line-height:1.2}
  .stack-bar{display:flex;height:12px;border-radius:var(--r-pill);overflow:hidden;background:var(--neutral-100)}
  table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
  td,th{white-space:nowrap}
  th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl{overflow-x:auto}
  tr[data-act="open"]{cursor:pointer;transition:150ms cubic-bezier(.2,.7,.2,1)}
  tr[data-act="open"]:hover{background:var(--neutral-50)}
  .cols{display:flex;align-items:flex-end;gap:6px;height:120px}
  .cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
  .cols i{display:block;width:100%;max-width:28px;background:var(--swu-purple-600);border-radius:6px 6px 0 0;min-height:2px}
  .cols span{font-size:10px;color:var(--muted)}

  /* ── โหมดตัวอักษรใหญ่ (พอร์ทัลแม่บ้าน — รองรับผู้สูงอายุ) ── */
  .big{font-size:20px;line-height:1.6}
  .big .sm{font-size:18px} .big .xs{font-size:16px}
  .big h2{font-size:28px} .big h3{font-size:22px}
  .big .chip{height:32px;padding:0 14px;font-size:16px}
  .big .btn{height:60px;font-size:20px;padding:0 24px}
  .big label.lbl{font-size:19px;margin-bottom:6px}
  .big select,.big textarea{font-size:20px}
  .big select{height:56px}
  .big textarea{min-height:110px}
  .big .check{padding:16px;gap:14px;min-height:64px;font-size:20px}

const Sessions = {

  /* token สั้น (6 ชม.) อยู่ใน sessionStorage · token "จดจำฉัน" (14 วัน) อยู่ใน localStorage — เหมือนเซิร์ฟเวอร์จริงที่ token ยาวไม่พึ่งแคช */
  load() { try { return Object.assign({}, JSON.parse(localStorage.getItem(this.key)) || {}, JSON.parse(sessionStorage.getItem(this.key)) || {}); } catch (e) { return {}; } },
  save(m) {
    const long = {}, short = {}; Object.keys(m).forEach(k => (m[k].long ? long : short)[k] = m[k]);
    try { sessionStorage.setItem(this.key, JSON.stringify(short)); localStorage.setItem(this.key, JSON.stringify(long)); } catch (e) {}
  },
  create(role, user, long) {
    const token = uid_(), m = this.load();
    m[token] = { role, user, exp: Date.now() + (long ? 14 * 86400 : 6 * 3600) * 1000, long: !!long };
    this.save(m); return token;
  },
  remove(token) { const m = this.load(); delete m[token]; this.save(m); },
  auth(token, roles) {
    const s = token && this.load()[token];
    if (!s || s.exp < Date.now()) throw new Error('SESSION_EXPIRED');
    if (s.role !== 'admin' && roles.indexOf(s.role) < 0) throw new Error('ไม่มีสิทธิ์ทำรายการนี้');
    return s;
  },
};

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      try { resolve(clone_(MOCK[fn](...args))); }
      catch (e) {
        if (e.message === 'SESSION_EXPIRED') { logout(true); return reject(new Error('หมดเวลาเข้าสู่ระบบ กรุณาเข้าใหม่')); }
        reject(e);
      }
    }, 180 + Math.random() * 220);
  });
}

    if (!window.google || !google.script) return reject(new Error('ต้องเปิดผ่านลิงก์เว็บแอปของ Apps Script'));
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.ok) return resolve(r.data);
        const msg = r ? r.error : 'ไม่มีการตอบกลับจากเซิร์ฟเวอร์';
        if (msg === 'SESSION_EXPIRED') { logout(true); return reject(new Error('หมดเวลาเข้าสู่ระบบ กรุณาเข้าใหม่')); }
        if (msg === 'MUST_CHANGE_PASSWORD') { if (S.auth) { S.auth.mustChange = true; openModal('chpw'); } return reject(new Error('กรุณาตั้งรหัสผ่านใหม่ก่อนเริ่มใช้งาน')); }
        reject(new Error(msg));
      })
      .withFailureHandler(reject)[fn](...args);
  });
}
@prod:end */
let toastT;
function toast(msg, err) {
  $('#toast').innerHTML = `<div class="${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').innerHTML = '', 3000);
}

/* ย่อรูปในเครื่องก่อนอัปโหลด (ยาวสุด 1280px, JPEG) */
function compress(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านไฟล์รูปไม่ได้')); };
    img.src = url;
  });
}

/* ข้อมูลทุกอย่างต้องเข้าสู่ระบบก่อน · สำเนาในเครื่องเก็บใน sessionStorage (หายเมื่อปิดแท็บ/ออกจากระบบ) ไม่ใช้ localStorage
   เพื่อไม่ให้คนที่ใช้เครื่องต่อเห็นข้อมูลพื้นที่ รูป และชื่อพนักงาน */
const SNAP_KEY = 'locsSnap_v2';
async function load(silent) {
  if (!S.auth) { S.locs = []; S.loaded = true; render(); return; }
  if (!S.locs.length) {
    try { const snap = JSON.parse(sessionStorage.getItem(SNAP_KEY)); if (snap && snap.user === S.auth.user && snap.workDate === new Date().toLocaleDateString('sv-SE') && Date.now() - snap.t < 12 * 3600e3) { S.locs = snap.locations; S.workDate = snap.workDate; S.perms = snap.perms || S.perms; S.loaded = true; render(); } } catch (e) {}
  }
  try {
    const d = await api('apiGetData', S.auth.token);
    if (!S.auth) return;   // ออกจากระบบระหว่างรอ
    S.locs = d.locations; S.workDate = d.workDate; S.perms = d.perms || S.perms; S.loaded = true;
    try { sessionStorage.setItem(SNAP_KEY, JSON.stringify({ t: Date.now(), user: S.auth.user, workDate: d.workDate, locations: d.locations, perms: d.perms })); } catch (e) {}
    render();
    if (!silent) toast('อัปเดตข้อมูลล่าสุดแล้ว');
  } catch (e) {
    if (!S.auth) return;
    if (!S.locs.length) $('#app').innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ<br><span class="sm">${esc(e.message)}</span><br><br><button class="btn" onclick="load()">ลองใหม่</button></div>`;
    else if (!silent) toast(e.message, true);
  }
}

const STOCK_ROLE = { cleaner: 'requester', supervisor: 'lead', manager: 'store', admin: 'store' };
let STOCK_AI = false;   /* ปุ่มอ่านใบส่งของด้วย AI — เว็บจริงยังไม่เปิดใช้ (ดู gas/13_Api_Stock.js) · mockup แสดงผลจำลอง */
/* @dev:start */
STOCK_AI = true;
/* @dev:end */
const STOCK_API = { apiGetData: 'apiStockData', apiAddItem: 'apiStockAddItem', apiUpdateItem: 'apiStockUpdateItem', apiReceive: 'apiStockReceive', apiIssue: 'apiStockIssue', apiScanDoc: 'apiStockScan', apiGetPhotos: 'apiStockPhotos' };
const stockWin = () => { const f = $('#skFrame'); return f ? f.contentWindow : null; };
function sizeStock() { const h = $('#skHost'), f = $('#skFrame'); if (h && f && !h.hidden) f.style.height = Math.max(420, innerHeight - h.getBoundingClientRect().top) + 'px'; }
function resetStock() { const h = $('#skHost'); if (h) { h.innerHTML = ''; delete h.dataset.role; } }
function ensureStockFrame() {
  const h = $('#skHost'), role = S.auth.role;
  if (h.dataset.role && h.dataset.role !== role) resetStock();
  if (!$('#skFrame')) {
    const f = document.createElement('iframe'); f.id = 'skFrame'; f.title = 'เบิกอุปกรณ์'; f.setAttribute('sandbox', 'allow-scripts allow-modals allow-forms');
    f.srcdoc = new TextDecoder().decode(Uint8Array.from(atob(STOCK_B64), c => c.charCodeAt(0)));
    h.dataset.role = role; h.appendChild(f);
  }
  sizeStock();
}
function openStock() {
  S.stockFrom = S.view === 'stock' ? S.stockFrom : S.view; S.view = 'stock'; render();
  const w = stockWin(); if (w && $('#skHost').dataset.ready) w.postMessage({ sk: 'reload' }, '*');
}
addEventListener('resize', sizeStock);
addEventListener('message', async e => {
  const w = stockWin(); if (!w || e.source !== w || !S.auth) return;
  const m = e.data || {};
  if (m.sk === 'ready') { $('#skHost').dataset.ready = '1'; return w.postMessage({ sk: 'init', role: STOCK_ROLE[S.auth.role], name: S.auth.displayName || S.auth.user, ai: STOCK_AI }, '*'); }
  if (m.sk !== 'api') return;
  const fn = STOCK_API[m.fn]; let res;
  if (!fn) res = { ok: false, error: 'ไม่รู้จักคำสั่งนี้' };
  else { try { res = { ok: true, data: await api(fn, S.auth.token, m.payload || {}) }; } catch (err) { res = { ok: false, error: err.message }; } }
  w.postMessage({ sk: 'res', id: m.id, res }, '*');
});

/* หน้าแรก = เข้าสู่ระบบ · พนักงานทำความสะอาดไม่ต้องล็อกอิน (ปุ่มด้านล่าง) · Super Admin ที่เข้าแล้วจะเห็นตัวเลือกพอร์ทัล */
function vHome() {
  if (S.auth?.role === 'admin') return vPicker();
  let ru = ''; try { ru = localStorage.getItem('rememberUser') || ''; } catch (e) {}   // เก็บเฉพาะชื่อผู้ใช้ — ไม่เก็บรหัสผ่านในเครื่อง
  let demo = '';
  /* @dev:start */demo = `<div class="demo-hint no-print">บัญชีทดลอง (คลิกเพื่อกรอก):
      <button type="button" data-act="fillLogin" data-u="${CREDENTIALS.admin.username}" data-p="${CREDENTIALS.admin.password}">admin</button><button type="button" data-act="fillLogin" data-u="supervisor" data-p="${DEMO_PASSWORD}">supervisor</button><button type="button" data-act="fillLogin" data-u="manager" data-p="${DEMO_PASSWORD}">manager</button></div>`;/* @dev:end */
  return `
  <div class="login-wrap">
    <div class="card" style="padding:var(--s6)">
      <h2 style="font-size:24px">เข้าสู่ระบบ</h2>

        <label class="rm"><input type="checkbox" name="rm" ${ru ? 'checked' : ''}><span><b>จดจำฉันไว้ในเครื่องนี้</b><br><span class="xs muted">จำชื่อผู้ใช้ และเข้าสู่ระบบอัตโนมัติ 14 วัน · เบราว์เซอร์จะเสนอบันทึกรหัสผ่านให้ (เก็บในที่เก็บรหัสผ่านของเบราว์เซอร์ ไม่ใช่ในระบบนี้) — เลือกเฉพาะเครื่องส่วนตัว</span></span></label>
        <div id="loginErr" class="alert sm" style="display:none"></div>

/* รายการ "แจ้งแก้ไข" ของวันนี้ ต่อพื้นที่ — สร้างจากประวัติของวัน (เรียงตามเวลา):
     หัวหน้าตีกลับ / กรรมการแจ้งปรับปรุง → เปิด (open) · แม่บ้านตอบกลับ/ส่งงานแก้ไข → แก้แล้วรอตรวจ (replied)
     หัวหน้าตรวจผ่าน → เสร็จสิ้น (done) · หัวหน้าตอบรับทราบข้อเสนอแนะกรรมการ → เสร็จสิ้น (done) · ตีกลับซ้ำ → รายการที่แก้แล้วกลับมาเปิด */
function fixItems(l) {
  const items = [], parse = a => { const m = a.match(/^ตอบกลับแจ้งแก้ไข:\s?([\s\S]*?)(?:\s?\[รูป (\d+)\])?$/); return { note: m ? m[1] : '', photos: m && m[2] ? +m[2] : 0 }; };
  (l.history || []).forEach(h => {
    const a = h.action;
    if (h.role === 'supervisor' && /^(แก้ไขผลตรวจ — )?ตีกลับ/.test(a)) {
      items.forEach(x => { if (x.state === 'replied') x.state = 'open'; });
      items.push({ kind: 'reject', state: 'open', by: h.user, time: h.time, note: a.replace(/^(แก้ไขผลตรวจ — )?ตีกลับ:\s?/, '').replace(/\s?\[รูป \d+\]$/, '') });
    } else if (h.role === 'manager' && /^แจ้งปรับปรุง/.test(a)) {
      items.push({ kind: 'fb', state: 'open', by: h.user, time: h.time, stars: +(a.match(/\((\d) ดาว\)/) || [])[1] || 0, note: a.replace(/^แจ้งปรับปรุง:\s?/, '').replace(/\s?\[รูป \d+\]$/, '').replace(/\s?\(\d ดาว\)$/, '') });
    } else if (h.role === 'cleaner' && /^(ตอบกลับแจ้งแก้ไข|ส่งงานแก้ไขแล้ว)/.test(a)) {
      const r = /^ตอบกลับ/.test(a) ? parse(a) : { note: '', photos: 0 };
      items.forEach(x => { if (x.state === 'open') { x.state = 'replied'; x.reply = Object.assign({ by: h.user, time: h.time }, r); } });
    } else if (h.role === 'supervisor' && /^ตอบกลับแจ้งแก้ไข/.test(a)) {
      const r = parse(a);
      items.forEach(x => { if (x.state === 'open' && x.kind === 'fb') { x.state = 'done'; x.reply = Object.assign({ by: h.user, time: h.time }, r); } });
    } else if (h.role === 'supervisor' && /^(แก้ไขผลตรวจ — )?ตรวจผ่าน/.test(a)) {
      items.forEach(x => { if (x.state === 'replied') x.state = 'done'; });
    }
  });
  return items;
}
/* ต้องทำอะไรต่อ: แม่บ้าน = มีรายการเปิดอยู่ · หัวหน้า = มีข้อเสนอแนะกรรมการที่ยังไม่ตอบ หรือมีงานที่แม่บ้านแก้แล้วรอตรวจ */
const fixNeeds = (l, cleaner) => fixItems(l).some(x => cleaner ? x.state === 'open' : (x.state === 'replied' || (x.state === 'open' && x.kind === 'fb')));
const fixLocs = cleaner => S.locs.filter(l => fixItems(l).length).sort((a, b) => fixNeeds(b, cleaner) - fixNeeds(a, cleaner));
const fixCount = cleaner => S.locs.filter(l => fixNeeds(l, cleaner)).length;
const FIX_STATE = { open: ['รอแก้ไข', 'red'], replied: ['แก้ไขแล้ว · รอหัวหน้าตรวจ', 'violet'], done: ['เสร็จสิ้น', 'green'] };
function fixCard(l, cleaner) {
  const items = fixItems(l), open = items.some(x => x.state === 'open'), replied = items.some(x => x.state === 'replied');
  const fbOpen = items.some(x => x.state === 'open' && x.kind === 'fb');
  const canReply = cleaner ? open && l.status !== 'pending' : fbOpen;
  const showForm = canReply && S.replyOpen[l.id];
  const f = showForm ? cfForm('r' + l.id) : null;
  const photoReq = cleaner && can('cleaner', 'photo');
  return `
  <div class="card fix">
    <div class="row" style="align-items:flex-start"><div><h3>${esc(l.area)}</h3><div class="xs muted">${esc(who(l))}</div></div>${chip(l.status)}</div>
    <div class="stack" style="margin-top:10px">${items.map(x => `
      <div class="fixit ${x.state}">
        <div class="alert sm fixq ${x.kind === 'fb' ? 'fbq' : ''}"><b>${x.kind === 'reject' ? 'หัวหน้าแม่บ้านตีกลับ' : `คณะกรรมการแจ้งปรับปรุง · ${esc(x.by)}`}${x.time ? ' · ' + esc(x.time) : ''}${x.stars ? ' · ★ ' + x.stars : ''}</b><br>${esc(x.note)}</div>
        ${x.reply ? `<div class="fixr sm"><b>${esc(x.reply.by)} ตอบกลับ${x.reply.time ? ' · ' + esc(x.reply.time) : ''}</b>${x.reply.photos ? ` · 📷 ${x.reply.photos} รูป` : ''}${x.reply.note ? `<br>${esc(x.reply.note)}` : ''}</div>` : ''}
        <div class="xs"><span class="chip c-${FIX_STATE[x.state][1]}">${FIX_STATE[x.state][0]}</span></div>
      </div>`).join('')}</div>
    ${canReply && !showForm ? `<button class="btn ghost block" style="margin-top:10px" data-act="replyToggle" data-id="${l.id}">${cleaner ? 'ตอบกลับ / แนบรูป — แจ้งว่าแก้ไขแล้ว' : 'ตอบกลับ / รับทราบ (ดำเนินการแล้ว)'}</button>` : ''}
    ${cleaner && open && l.status === 'pending' ? `<div class="note sm" style="margin-top:10px">ยังไม่ได้ทำความสะอาดพื้นที่นี้ — ทำเช็คลิสต์และส่งรายงานก่อน แล้วจึงตอบกลับได้</div>` : ''}
    ${showForm ? `
    <div class="sec stack">
      <div><label class="lbl">${cleaner ? 'แก้ไขอะไรไปแล้ว' : 'ดำเนินการอย่างไร'}</label><textarea rows="2" data-act="note" data-id="r${l.id}" placeholder="${cleaner ? 'เช่น เช็ดกระจกและเก็บขยะแล้ว' : 'เช่น แจ้งแม่บ้านให้แก้ไขแล้ว'}">${esc(f.note)}</textarea></div>
      <div><label class="lbl">${photoReq ? 'รูปหลังแก้ไข (อย่างน้อย 1 รูป)' : 'แนบรูป (ไม่บังคับ)'}</label>${photoPicker('r' + l.id)}</div>
      <div class="row"><button class="btn block" data-act="replyToggle" data-id="${l.id}">ยกเลิก</button>
        <button class="btn primary block" data-act="replySend" data-id="${l.id}" ${f.busy ? 'disabled' : ''}>${f.busy ? 'กำลังส่ง...' : cleaner ? 'ส่งแจ้งการแก้ไข' : 'ส่งการตอบกลับ'}</button></div>
      ${cleaner ? '<div class="xs muted">เมื่อส่งแล้ว งานจะกลับไปที่หัวหน้าแม่บ้านเพื่อตรวจซ้ำอีกครั้ง</div>' : ''}
    </div>` : ''}
    <div class="row xs" style="margin-top:10px"><span class="muted">${items.length} รายการ${replied ? ' · มีงานแก้ไขแล้วรอตรวจ' : ''}</span>
      ${!cleaner && QUEUE.supervisor.includes(l.status) ? `<button class="btn sm primary" data-act="open" data-id="${l.id}">ตรวจงาน ›</button>` : `<button class="btn sm ghost" data-act="${cleaner ? 'area' : 'open'}" data-id="${l.id}">รายละเอียด ›</button>`}</div>
  </div>`;
}

/* ตอบกลับแจ้งแก้ไข: แม่บ้าน → ส่งต่อหัวหน้าตรวจซ้ำ · หัวหน้า → รับทราบ/ดำเนินการแล้ว */
async function submitReply(locId) {
  const l = loc(locId), f = cfForm('r' + locId), cleaner = S.view === 'cleaner';
  if (f.busy || $('#sa')) return;
  if (f.uploading) return toast('รอให้อัปโหลดรูปเสร็จก่อน', true);
  if (!f.note.trim()) return toast('กรุณาพิมพ์ข้อความตอบกลับ', true);
  if (cleaner && can('cleaner', 'photo') && !f.photos.length) return toast('กรุณาแนบรูปหลังแก้ไขอย่างน้อย 1 รูป', true);
  if (!await askConfirm({ tone: 'ask', title: cleaner ? 'ยืนยันแจ้งว่าแก้ไขแล้ว?' : 'ยืนยันส่งการตอบกลับ?', text: `${l.area}\n` + (cleaner ? 'ส่งให้หัวหน้าแม่บ้านตรวจซ้ำอีกครั้ง' : 'บันทึกการดำเนินการ (ไม่ต้องตรวจซ้ำ)'), ok: 'ส่ง' })) return;
  if (f.busy) return;
  f.busy = true; render();
  try {
    const updated = await queue(() => api('apiFixReply', S.auth.token, l.id, f.note, f.photos.map(x => ({ id: x.id }))));
    upsert(updated); delete S.cleanerForms['r' + locId]; S.replyOpen[locId] = false; render();
    await askDone({ title: cleaner ? 'ส่งแจ้งการแก้ไขแล้ว' : 'ส่งการตอบกลับแล้ว', text: cleaner ? `${l.area}\nส่งให้หัวหน้าแม่บ้านตรวจซ้ำแล้ว` : l.area });
  } catch (e) {
    f.busy = false; toast(e.message, true); render();
    if (/สถานะงานเปลี่ยน/.test(e.message)) load(true);
  }
}

/* =========================================================
   แท็บ: แดชบอร์ด — ตัวกรอง (สัปดาห์/เดือน/อาคาร) + กราฟ
   ========================================================= */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const thShort = d => d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

/* ช่วงตามตัวกรอง: สัปดาห์ (จันทร์–อาทิตย์) · เดือนปฏิทิน (แท่งรายวัน) · ปีปฏิทิน (แท่งรายเดือน) · offset 0 = ปัจจุบัน, -1 = ก่อนหน้า
   days = คีย์ของแต่ละแท่ง (วัน yyyy-mm-dd หรือเดือน yyyy-mm) · keyOf = แปลงวันที่เป็นคีย์ · lab/short = ป้ายเต็ม/ป้ายแกน */
function dfRange() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  let s, e;
  if (S.dfPeriod === 'year') {
    const y = now.getFullYear() + S.dfOffset; s = new Date(y, 0, 1); e = new Date(y, 11, 31);
    const lastM = e > now ? now.getMonth() : 11, months = [];
    for (let m = 0; m <= lastM; m++) months.push(`${y}-${String(m + 1).padStart(2, '0')}`);
    const oldest = S.hist && S.hist.length ? S.hist[0].date : ymd(now), nDays = Math.round(((e > now ? now : e) - s) / 864e5) + 1;
    const mName = k => new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1, 1).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
    return { label: `ปี ${y + 543}`, days: months, keyOf: d => d.slice(0, 7), lab: mName, short: k => new Date(2000, Number(k.slice(5, 7)) - 1, 1).toLocaleDateString('th-TH', { month: 'short' }), unit: 'รายเดือน', cell: 'เดือน', nDays, canPrev: ymd(s) > oldest, canNext: S.dfOffset < 0 };
  }
  if (S.dfPeriod === 'month') { s = new Date(now.getFullYear(), now.getMonth() + S.dfOffset, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 0); }
  else { s = new Date(now); s.setDate(now.getDate() - ((now.getDay() + 6) % 7) + S.dfOffset * 7); e = new Date(s); e.setDate(s.getDate() + 6); }
  const label = S.dfPeriod === 'month' ? s.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }) : `${thShort(s)} – ${thShort(e)} ${e.getFullYear() + 543}`;
  const last = e > now ? now : e, days = [];
  for (const d = new Date(s); d <= last; d.setDate(d.getDate() + 1)) days.push(ymd(d));
  const oldest = S.hist && S.hist.length ? S.hist[0].date : ymd(now);
  return { label, days, keyOf: d => d, lab: thDate, short: d => d.slice(8), unit: 'รายวัน', cell: 'วัน', nDays: days.length, canPrev: ymd(s) > oldest, canNext: S.dfOffset < 0 };
}
const areaMatch = (area, cat) => !S.dfArea || (S.dfArea.startsWith('cat:') ? cat === S.dfArea.slice(4) : area === S.dfArea);

/* แถวข้อมูล = ประวัติ + วันนี้ (จากสถานะสดของพื้นที่ที่ตัดสินแล้ว) */
function dfRows(R) {
  const set = new Set(R.days), rows = (S.hist || []).filter(r => set.has(R.keyOf(r.date)) && areaMatch(r.area, r.category));
  const today = ymd(new Date());
  if (set.has(R.keyOf(today))) S.locs.forEach(l => {
    if (!areaMatch(l.area, l.category)) return;
    const rej = l.history.filter(h => /^(แก้ไขผลตรวจ — )?ตีกลับ/.test(h.action));
    const sup = rej.filter(h => h.role === 'supervisor').length, fb = l.history.filter(h => h.role === 'manager' && /^แจ้งปรับปรุง/.test(h.action)).length;
    if (l.status === 'approved' || sup + fb) rows.push({ date: today, area: l.area, category: l.category, sup, fb, approved: l.status === 'approved', rating: fb ? (l.rating || 0) : 0 });
  });
  return rows;
}
function dfAgg(rows, R) {
  const days = R.days;
  const byDay = Object.fromEntries(days.map(d => [d, { n: 0, ok: 0, sup: 0, fb: 0 }]));
  const byArea = {};
  S.locs.filter(l => areaMatch(l.area, l.category)).forEach(l => { byArea[l.area] = { area: l.area, n: 0, ok: 0, sup: 0, fb: 0, rs: 0, rn: 0, heat: days.map(() => 0) }; });
  rows.forEach(r => {
    const key = R.keyOf(r.date), d = byDay[key], a = byArea[r.area]; if (!d || !a) return;
    d.n++; d.ok += r.approved ? 1 : 0; d.sup += r.sup; d.fb += r.fb;
    a.n++; a.ok += r.approved ? 1 : 0; a.sup += r.sup; a.fb += r.fb; if (r.rating) { a.rs += r.rating; a.rn++; }
    a.heat[days.indexOf(key)] += r.sup;
  });
  // ตีกลับ = หัวหน้าตีกลับ (ทำให้ต้องส่งซ้ำ) · แจ้งปรับปรุง = ข้อเสนอแนะจากคณะกรรมการ (ไม่ทำให้ส่งซ้ำ) แสดงต่อท้ายแท่งเดียวกัน
  const areas = Object.values(byArea).map(a => { const rejects = a.sup, submits = a.n + rejects; return Object.assign(a, { rejects, submits, rate: submits ? rejects / submits : 0, rateAll: submits ? (a.sup + a.fb) / submits : 0 }); })
    .sort((a, b) => b.rateAll - a.rateAll || a.area.localeCompare(b.area, 'th'));
  const t = areas.reduce((s, a) => ({ n: s.n + a.n, ok: s.ok + a.ok, sup: s.sup + a.sup, fb: s.fb + a.fb, rs: s.rs + a.rs, rn: s.rn + a.rn }), { n: 0, ok: 0, sup: 0, fb: 0, rs: 0, rn: 0 });
  t.rejects = t.sup; t.submits = t.n + t.rejects; t.rate = t.submits ? t.rejects / t.submits : 0;
  return { byDay, areas, t };
}

/* กราฟแท่ง (ซ้อนชั้นได้) — cols[i] = { segs:[{v,c}], title } */
function colChart(days, cols, max, fmt, short = d => d.slice(8)) {
  const many = days.length > 16;
  return `<div class="cc${many ? ' many' : ''}">${cols.map((c, i) => {
    const tot = c.segs.reduce((s, x) => s + x.v, 0);
    return `<div title="${esc(c.title)}"><span class="cv">${tot ? fmt(tot) : ''}</span>
      <div class="cs">${c.segs.filter(x => x.v).map(x => `<i style="height:${Math.max(x.v / max * 100, 1.5)}%;background:${x.c}"></i>`).join('')}</div>
      <span class="cl">${many && i % 5 !== 0 ? '' : short(days[i])}</span></div>`;
  }).join('')}</div>`;
}

/* ระดับสีของช่องฮีตแมป: รายวัน 0/1/2+ ครั้ง · รายเดือน 0 / 1–14 / 15+ ครั้ง */
const hmLevel = (R, c) => R.unit === 'รายเดือน' ? (c === 0 ? 0 : c < 15 ? 1 : 2) : Math.min(c, 2);
const hmLegend = R => R.unit === 'รายเดือน' ? ['1–14 ครั้ง', '15 ครั้งขึ้นไป'] : ['1 ครั้ง', '2 ครั้งขึ้นไป'];
function dfBar(R) {
  const cats = [...new Set(S.locs.map(l => l.category))];
  const btn = (p, label) => `<button class="${S.dfPeriod === p ? 'on' : ''}" data-act="dfPeriod" data-p="${p}">${label}</button>`;
  return `
  <div class="card df no-print">
    <div class="tabs">${btn('week', 'รายสัปดาห์')}${btn('month', 'รายเดือน')}${btn('year', 'รายปี')}</div>
    <div class="nav">
      <button class="btn sm ghost" data-act="dfPrev" ${R.canPrev ? '' : 'disabled'} aria-label="ก่อนหน้า">‹</button>
      <b>${esc(R.label)}</b>
      <button class="btn sm ghost" data-act="dfNext" ${R.canNext ? '' : 'disabled'} aria-label="ถัดไป">›</button>
      ${S.dfOffset ? `<button class="btn sm" data-act="dfNow">ปัจจุบัน</button>` : ''}
    </div>
    <select data-act="dfArea" aria-label="เลือกอาคาร / พื้นที่">
      <option value="">ทุกอาคาร / พื้นที่ (${S.locs.length})</option>
      ${cats.map(c => `<optgroup label="${esc(c)}"><option value="cat:${esc(c)}" ${S.dfArea === 'cat:' + c ? 'selected' : ''}>ทั้งหมวด ${esc(c)}</option>
        ${S.locs.filter(l => l.category === c).map(l => `<option value="${esc(l.area)}" ${S.dfArea === l.area ? 'selected' : ''}>${esc(l.area)}</option>`).join('')}</optgroup>`).join('')}
    </select>
  </div>`;
}

/* ---------- ปรับแต่งแดชบอร์ด: เลือกว่าจะแสดงส่วนไหน และจัดลำดับก่อน/หลัง (จำไว้ในเบราว์เซอร์นี้) ---------- */
const DASH_W = [['kpi', 'ตัวเลขสรุป (KPI)'], ['trend', 'กราฟตรวจผ่าน / ตีกลับตามช่วงเวลา'], ['areas', 'อัตราตีกลับแยกรายพื้นที่'], ['heat', 'ฮีตแมปการตีกลับ'], ['today', 'สถานะวันนี้และสถานะรายพื้นที่'], ['staff', 'ผลงานรายพนักงานวันนี้']];
function dashLayout() {
  let o = null; try { o = JSON.parse(localStorage.getItem('dashLayout')); } catch (e) {}
  const keys = DASH_W.map(x => x[0]), saved = (o && Array.isArray(o.order) ? o.order : []).filter(k => keys.includes(k));
  return { order: [...saved, ...keys.filter(k => !saved.includes(k))], hidden: (o && Array.isArray(o.hidden) ? o.hidden : []).filter(k => keys.includes(k)) };
}
function saveDashLayout(l) { try { localStorage.setItem('dashLayout', JSON.stringify(l)); } catch (e) {} }
function dashBody(W, empty) {
  const lay = dashLayout(); W.today = todayPanel(); W.staff = staffPerf();
  let emptyShown = false;
  return lay.order.filter(k => !lay.hidden.includes(k)).map(k => {
    if (empty && ['trend', 'areas', 'heat'].includes(k)) { if (emptyShown) return ''; emptyShown = true; return '<div class="card empty">ไม่มีข้อมูลในช่วงที่เลือก</div>'; }
    return W[k];
  }).join('\n');
}
function mDashCfg() {
  const lay = dashLayout();
  return `
  <div class="ov" data-act="closeOv"><div class="sheet" style="max-width:480px">
    <div class="row"><h2>ปรับแต่งแดชบอร์ด</h2><button class="x-close" data-act="close">${ICONS.x}</button></div>
    <p class="sm muted" style="margin-bottom:12px">เลือกส่วนที่ต้องการแสดง และกดลูกศรเพื่อเลื่อนขึ้น/ลง — จำค่าไว้ในเบราว์เซอร์นี้ (รายงาน PDF ไม่เปลี่ยน)</p>
    <div class="stack">${lay.order.map((k, i) => { const on = !lay.hidden.includes(k), nm = DASH_W.find(x => x[0] === k)[1]; return `
      <div class="row" style="gap:8px"><button type="button" class="check ${on ? 'on' : ''}" style="flex:1" data-act="dashToggle" data-k="${k}"><span class="box">${on ? ICONS.check : ''}</span><span>${nm}</span></button>
        <button type="button" class="btn sm ghost" data-act="dashMove" data-k="${k}" data-d="-1" aria-label="เลื่อนขึ้น" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="btn sm ghost" data-act="dashMove" data-k="${k}" data-d="1" aria-label="เลื่อนลง" ${i === lay.order.length - 1 ? 'disabled' : ''}>↓</button></div>`; }).join('')}</div>
    <div class="row" style="margin-top:14px"><button type="button" class="btn sm ghost" data-act="dashReset">คืนค่าเริ่มต้น</button><button type="button" class="btn primary" data-act="close">เสร็จสิ้น</button></div>
  </div></div>`;
}
function vDash() {
  if (!S.hist) return `<div class="empty"><span class="spin"></span></div>`;
  const R = dfRange(), rows = dfRows(R), A = dfAgg(rows, R), T = A.t;
  const scope = S.dfArea ? (S.dfArea.startsWith('cat:') ? 'หมวด ' + S.dfArea.slice(4) : S.dfArea) : 'ทุกอาคาร / พื้นที่';
  const okPct = T.n ? Math.round(T.ok / T.n * 100) : 0;
  const avg = T.rn ? (T.rs / T.rn).toFixed(1) : '–';
  const empty = !T.n && !T.rejects && !T.fb;

  const apprCols = R.days.map(d => { const x = A.byDay[d]; return { segs: x.n ? [{ v: x.ok / x.n * 100, c: 'var(--green)' }] : [], title: `${R.lab(d)}: ตรวจผ่านแล้ว ${x.ok}/${x.n} พื้นที่` }; });
  const rejCols = R.days.map(d => { const x = A.byDay[d]; return { segs: [{ v: x.sup, c: 'var(--teal-800)' }, { v: x.fb, c: 'var(--blue-600)' }], title: `${R.lab(d)}: ตีกลับ ${x.sup} ครั้ง · กรรมการแจ้งปรับปรุง ${x.fb} ครั้ง` }; });
  const rejMax = Math.max(1, ...R.days.map(d => A.byDay[d].sup + A.byDay[d].fb));

  const maxRate = Math.max(...A.areas.map(a => a.rateAll), 0.01);
  const bars = A.areas.map(a => {
    const sp = (a.sup + a.fb) ? a.sup / (a.sup + a.fb) * 100 : 0;
    return `<div class="rv-row" title="${esc(a.area)}: ตีกลับ ${a.rejects} จาก ${a.submits} ครั้ง · กรรมการแจ้งปรับปรุง ${a.fb} ครั้ง">
      <div class="rv-name">${esc(a.area)}</div>
      <div class="rv-track"><div class="rv-fill" style="width:${a.rateAll / maxRate * 100}%">${a.sup ? `<i style="width:${sp}%;background:var(--teal-800)"></i>` : ''}${a.fb ? `<i style="width:${100 - sp}%;background:var(--blue-600)"></i>` : ''}</div></div>
      <div class="rv-val">${(a.rate * 100).toFixed(0)}% <span class="xs muted">${a.rejects}/${a.submits}${a.fb ? ` · แจ้ง ${a.fb}` : ''}</span></div></div>`;
  }).join('');
  const cols = `grid-template-columns:repeat(${R.days.length},1fr)`;
  const heat = A.areas.map(a => `<div class="hm-row"><div class="rv-name">${esc(a.area)}</div>
    <div class="hm-cells" style="${cols}">${a.heat.map((c, i) => `<b class="hm-c hm-${hmLevel(R, c)}" title="${esc(a.area)} · ${esc(R.lab(R.days[i]))}: ตีกลับ ${c} ครั้ง"></b>`).join('')}</div></div>`).join('');
  const legend = `<div class="xs" style="display:flex;gap:14px;flex-wrap:wrap"><span><b style="color:var(--teal-800)">●</b> หัวหน้าแม่บ้านตีกลับ</span><span><b style="color:var(--blue-600)">●</b> คณะกรรมการแจ้งปรับปรุง</span></div>`;

  return `
  <div class="stack">
    <div class="row" style="flex-wrap:wrap">
      <div><h2>แดชบอร์ด</h2><div class="sm muted">${esc(scope)} · ${esc(R.label)} · ข้อมูลวันนี้อัปเดตอัตโนมัติทุก 1 นาที</div></div>
      <div class="actions no-print">
        <button class="btn sm primary" data-act="report">ดาวน์โหลดรายงาน (PDF)</button><button class="btn sm ghost" data-act="dashCfg">ปรับแต่งแดชบอร์ด</button>

      </div>
    </div>
    ${dfBar(R)}

    ${dashBody({
      kpi: `<div class="stats">
      ${stat('รายงานที่ส่งทั้งหมด', T.submits, `${T.n} พื้นที่-วัน + ส่งซ้ำ ${T.rejects}`, 'gray')}
      ${stat('ตรวจผ่านแล้ว', okPct + '%', `${T.ok} จาก ${T.n} พื้นที่-วัน`, 'green')}
      ${stat('ตีกลับ', T.rejects + ' ครั้ง', `อัตรา ${(T.rate * 100).toFixed(0)}% (หัวหน้าแม่บ้าน)`, 'red')}
      ${stat('แจ้งปรับปรุง', T.fb + ' ครั้ง', 'จากคณะกรรมการ', 'blue')}
      ${stat('คะแนนเฉลี่ย', avg, `จากกรรมการ ${T.rn} ครั้ง`, 'amber')}
    </div>`,
      trend: `<div class="grid2">
      <div class="card"><h3>อัตราตรวจผ่าน${R.unit}</h3><div class="xs muted">% ของพื้นที่ที่หัวหน้าแม่บ้านตรวจผ่านแล้ว</div>${colChart(R.days, apprCols, 100, v => Math.round(v) + '%', R.short)}</div>
      <div class="card"><div class="row" style="flex-wrap:wrap;align-items:flex-start"><div><h3>ตีกลับ / แจ้งปรับปรุง${R.unit}</h3><div class="xs muted">หัวหน้าแม่บ้านตีกลับ และคณะกรรมการแจ้งปรับปรุง</div></div>${legend}</div>${colChart(R.days, rejCols, rejMax, v => v, R.short)}</div>
    </div>`,
      areas: `<div class="card">
      <div class="row" style="flex-wrap:wrap;align-items:flex-start">
        <div><h3>อัตราการตีกลับ / แก้ไขงาน แยกรายพื้นที่</h3><div class="xs muted">อัตรา = ครั้งที่ถูกตีกลับ ÷ รายงานที่ส่งทั้งหมด · ส่วนสีน้ำเงิน = คณะกรรมการแจ้งปรับปรุง · เรียงจากมากไปน้อย</div></div>${legend}
      </div>
      <div class="rv" style="margin-top:12px">${bars}</div>
    </div>`,
      heat: `<div class="card">
      <h3>รูปแบบการตีกลับ${R.unit} แยกรายพื้นที่</h3>
      <div class="xs muted" style="margin-bottom:10px">แต่ละช่อง = 1 ${R.cell} · สีเข้มขึ้น = ถูกตีกลับหลายครั้ง</div>
      <div class="tbl"><div class="hm">
        <div class="hm-row"><div class="rv-name"></div><div class="hm-head" style="${cols}">${R.days.map((d, i) => `<span>${R.days.length > 16 && i % 5 ? '' : R.short(d)}</span>`).join('')}</div></div>${heat}
      </div></div>
      <div class="xs muted" style="margin-top:10px;display:flex;gap:14px;align-items:center"><span class="hm-c hm-0" style="display:inline-block;width:14px;height:14px"></span> ไม่ตีกลับ <span class="hm-c hm-1" style="display:inline-block;width:14px;height:14px"></span> ${hmLegend(R)[0]} <span class="hm-c hm-2" style="display:inline-block;width:14px;height:14px"></span> ${hmLegend(R)[1]}</div>
    </div>`,
    }, empty)}
  </div>`;
}

/* =========================================================
   รายงาน PDF — ใช้ตัวกรองเดียวกับแดชบอร์ด (สัปดาห์/เดือน/อาคาร) แต่จัดเค้าโครงใหม่ให้กระชับ อ่านจบใน 1 หน้า A4
   ========================================================= */
function reportHtml() {
  const R = dfRange(), A = dfAgg(dfRows(R), R), T = A.t;
  const scope = S.dfArea ? (S.dfArea.startsWith('cat:') ? 'หมวด ' + S.dfArea.slice(4) : S.dfArea) : 'ทุกอาคาร / พื้นที่';
  const okPct = T.n ? Math.round(T.ok / T.n * 100) : 0, avg = T.rn ? (T.rs / T.rn).toFixed(1) : '–';
  const kpi = (t, v, s) => `<div><span>${t}</span><b>${v}</b><small>${s}</small></div>`;

  const cols = R.days.map(d => { const x = A.byDay[d]; return { segs: [{ v: x.sup, c: 'var(--teal-800)' }, { v: x.fb, c: 'var(--blue-600)' }], title: `${R.lab(d)}: ตีกลับ ${x.sup} · แจ้งปรับปรุง ${x.fb}` }; });
  const max = Math.max(1, ...R.days.map(d => A.byDay[d].sup + A.byDay[d].fb));
  const okCols = R.days.map(d => { const x = A.byDay[d]; return { segs: x.n ? [{ v: x.ok / x.n * 100, c: 'var(--green)' }] : [], title: `${R.lab(d)}: ตรวจผ่าน ${x.ok}/${x.n}` }; });

  const watch = A.areas.filter(a => a.sup || a.fb).slice(0, 3);
  const insights = [
    T.submits ? `ช่วงนี้มีรายงาน ${T.submits} ฉบับ หัวหน้าแม่บ้านตรวจผ่านแล้ว ${okPct}% (${T.ok}/${T.n} พื้นที่-วัน)` : 'ยังไม่มีข้อมูลรายงานในช่วงที่เลือก',
    T.rejects ? `ถูกตีกลับ ${T.rejects} ครั้ง (${(T.rate * 100).toFixed(0)}% ของรายงานทั้งหมด)` : 'ไม่มีการตีกลับ',
    T.fb ? `คณะกรรมการแจ้งจุดปรับปรุง ${T.fb} ครั้ง${T.rn ? ` คะแนนเฉลี่ย ${avg}/5` : ''}` : 'คณะกรรมการยังไม่ได้แจ้งจุดปรับปรุง',
    watch.length ? `พื้นที่ที่ควรติดตาม: ${watch.map(a => `${a.area} (ตีกลับ ${a.sup}${a.fb ? `, แจ้งปรับปรุง ${a.fb}` : ''})`).join(' · ')}` : 'ไม่พบพื้นที่ที่ต้องติดตามเป็นพิเศษ',
  ].filter(Boolean);

  const maxRate = Math.max(...A.areas.map(a => a.rateAll), 0.01);
  const trs = A.areas.map(a => {
    const sp = (a.sup + a.fb) ? a.sup / (a.sup + a.fb) * 100 : 0, w = a.rateAll / maxRate * 100;
    return `<tr><td>${esc(a.area)}</td><td class="n">${a.submits}</td><td class="n">${a.ok}/${a.n}</td><td class="n">${a.sup}</td><td class="n">${a.fb}</td><td class="n">${a.rn ? (a.rs / a.rn).toFixed(1) : '–'}</td>
      <td style="width:22%"><div class="rp-bar"><div style="display:flex;width:${w}%">${a.sup ? `<i style="width:${sp}%;background:var(--teal-800)"></i>` : ''}${a.fb ? `<i style="width:${100 - sp}%;background:var(--blue-600)"></i>` : ''}</div></div></td></tr>`;
  }).join('');

  const fbs = S.locs.filter(l => l.managerNote && areaMatch(l.area, l.category)).slice(0, 4);   // จำกัด 4 รายการให้รายงานอยู่ในหน้าเดียว
  const leg = `<div class="rp-leg"><span><b style="color:var(--teal-800)">●</b> หัวหน้าแม่บ้านตีกลับ</span><span><b style="color:var(--blue-600)">●</b> คณะกรรมการแจ้งปรับปรุง</span></div>`;
  return `
    <div class="rp-head">
      <span class="logo-mark" role="img" aria-label="ศูนย์กีฬาสิรินธร"></span>
      <div style="flex:1"><h1>รายงานผลการตรวจความสะอาด</h1><div class="rp-meta" style="text-align:left">ศูนย์กีฬาสิรินธร มหาวิทยาลัยศรีนครินทรวิโรฒ</div></div>
      <div class="rp-meta"><b>${esc(R.label)}</b><br>${esc(scope)}<br>${R.nDays} วัน · จัดทำ ${new Date().toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })}</div>
    </div>
    <div class="rp-kpi">
      ${kpi('รายงานที่ส่ง', T.submits, `${T.n} พื้นที่-วัน`)}${kpi('ตรวจผ่านแล้ว', okPct + '%', `${T.ok}/${T.n}`)}${kpi('ตีกลับ', T.rejects, `อัตรา ${(T.rate * 100).toFixed(0)}%`)}${kpi('แจ้งปรับปรุง', T.fb, 'จากคณะกรรมการ')}${kpi('คะแนนเฉลี่ย', avg, 'เต็ม 5')}
    </div>
    <ul class="rp-sum">${insights.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <div class="rp-2">
      <div><h2>อัตราตรวจผ่าน${R.unit} (%)</h2>${colChart(R.days, okCols, 100, v => Math.round(v), R.short)}</div>
      <div><h2>ตีกลับ / แจ้งปรับปรุง${R.unit} (ครั้ง)</h2>${colChart(R.days, cols, max, v => v, R.short)}${leg}</div>
    </div>
    <h2>สรุปรายพื้นที่ (เรียงจากต้องติดตามมากไปน้อย)</h2>
    <table>
      <tr><th>พื้นที่</th><th class="n">รายงาน</th><th class="n">ตรวจผ่าน</th><th class="n">ตีกลับ</th><th class="n">แจ้งปรับปรุง</th><th class="n">คะแนน</th><th>สัดส่วน</th></tr>
      ${trs || '<tr><td colspan="7">ไม่มีข้อมูล</td></tr>'}
    </table>
    ${leg}
    ${fbs.length ? `<h2>ข้อเสนอแนะล่าสุดจากคณะกรรมการ (วันนี้)</h2><ul class="rp-fb">${fbs.map(l => `<li><b>${esc(l.area)}</b> — ${esc(l.managerNote)}${l.rating ? ` (★ ${l.rating})` : ''}</li>`).join('')}</ul>` : ''}
    <div class="rp-sign"><div>ผู้จัดทำรายงาน<br>(ผู้ดูแลระบบ)</div><div>หัวหน้าแม่บ้าน</div><div>ประธานคณะกรรมการตรวจความสะอาด</div></div>
    <div class="rp-foot">รายงานนี้สร้างจากระบบตรวจความสะอาด ศูนย์กีฬาสิรินธร มศว</div>`;
}

/* ดาวน์โหลดรายงาน = เปิดหน้าต่างพิมพ์เฉพาะรายงาน (เลือก "บันทึกเป็น PDF") · หน้าแดชบอร์ดบนจอไม่เปลี่ยน */
function downloadReport() {
  const box = $('#report'), old = document.title;
  box.innerHTML = reportHtml();
  document.title = `รายงานตรวจความสะอาด ${dfRange().label}`;
  const done = () => { box.innerHTML = ''; document.title = old; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}

/* สถานะสดของวันนี้ (ตามตัวกรองอาคาร) */
function todayPanel() {
  const L = S.locs.filter(l => areaMatch(l.area, l.category)), n = L.length || 1;
  const cnt = st => L.filter(l => l.status === st).length;
  const approved = cnt('approved'), rejected = cnt('rejected'), inReview = cnt('cleaner_done'), pending = cnt('pending');
  const seg = (v, c) => v ? `<i style="width:${v / n * 100}%;background:${c}"></i>` : '';
  return `
    <div class="card">
      <div class="row" style="flex-wrap:wrap"><h3>สถานะวันนี้ (${thDate(S.workDate)})</h3>
        <div class="xs muted" style="display:flex;gap:14px;flex-wrap:wrap"><span><b style="color:var(--green)">●</b> ตรวจผ่านแล้ว ${approved}</span><span><b style="color:var(--violet)">●</b> รอหัวหน้าตรวจ ${inReview}</span><span><b style="color:var(--neutral-200)">●</b> ยังไม่ส่ง ${pending}</span><span><b style="color:var(--red)">●</b> ต้องแก้ไข ${rejected}</span></div></div>
      <div class="stack-bar" style="margin-top:10px">${seg(approved, 'var(--green)')}${seg(inReview, 'var(--violet)')}${seg(pending, 'var(--neutral-200)')}${seg(rejected, 'var(--red)')}</div>
    </div>
    <div class="card tbl">
      <h3 style="margin-bottom:6px">สถานะรายพื้นที่วันนี้</h3>
      <table>
        <tr><th>พื้นที่</th><th>ผู้ส่งรายงาน</th><th>ความคืบหน้า</th><th>สถานะ</th><th>คะแนน</th><th>ตีกลับ</th></tr>
        ${L.map(l => { const p = prog(l); return `
          <tr data-act="open" data-id="${l.id}" style="cursor:pointer">
            <td>${esc(l.area)}</td><td class="sm">${esc(sender(l) || '–')}</td>
            <td class="sm">${p.d}/${p.t}</td><td>${chip(l.status)}</td>
            <td>${l.rating ? '★ ' + l.rating : '–'}</td><td>${l.rejectCount || '–'}</td>
          </tr>`; }).join('')}
      </table>
    </div>`;
}

/* ผลงานรายพนักงานวันนี้ — แม่บ้านเวียนพื้นที่ จึงนับตามชื่อผู้ส่งรายงานของแต่ละพื้นที่ (ตามตัวกรองอาคาร) */
function staffPerf() {
  const m = {};
  S.locs.filter(l => areaMatch(l.area, l.category)).forEach(l => {
    senders(l).forEach(n => {
      const r = m[n] = m[n] || { name: n, areas: [], ok: 0, rejects: 0 };
      r.areas.push(l.area); if (l.status === 'approved') r.ok++; r.rejects += l.rejectCount || 0;
    });
  });
  const rows = Object.values(m).sort((a, b) => b.areas.length - a.areas.length || a.name.localeCompare(b.name, 'th'));
  if (!rows.length) return `<div class="card"><h3>ผลงานรายพนักงานวันนี้</h3><div class="empty sm">วันนี้ยังไม่มีพนักงานส่งรายงาน</div></div>`;
  return `
    <div class="card tbl">
      <h3 style="margin-bottom:2px">ผลงานรายพนักงานวันนี้</h3><div class="xs muted" style="margin-bottom:6px">นับตามผู้ส่งรายงานของแต่ละพื้นที่ (แม่บ้านเวียนพื้นที่ทำงาน)</div>
      <table>
        <tr><th>พนักงาน</th><th>พื้นที่ที่ส่งวันนี้</th><th>ตรวจผ่านแล้ว</th><th>ถูกตีกลับ</th></tr>
        ${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="sm">${r.areas.length} · ${esc(r.areas.slice(0, 2).join(', '))}${r.areas.length > 2 ? ' +' + (r.areas.length - 2) : ''}</td><td>${r.ok} <span class="xs muted">(${Math.round(r.ok / r.areas.length * 100)}%)</span></td><td>${r.rejects || '–'}</td></tr>`).join('')}
      </table>
    </div>`;
}

/* =========================================================
   แท็บ: จัดการสิทธิ์ — บุคลากรทุกตำแหน่ง + สถานะ + ตารางสิทธิ์ของแต่ละบทบาท
   ========================================================= */
const PERM_LABEL = Object.fromEntries(PERM_DEFS.map(p => [p.key, p.label]));
/* ป้ายเหตุการณ์ในประวัติเข้าสู่ระบบ (ผลลัพธ์จากเซิร์ฟเวอร์) — ต้องอยู่นอกบล็อก @dev เพราะหน้า Admin ใช้ในโปรดักชันด้วย */
const LOGIN_RESULT = { ok: ['เข้าสู่ระบบ', 'green'], logout: ['ออกจากระบบ', 'gray'], badpw: ['รหัสผ่านผิด', 'red'], unknown: ['ไม่พบ ID', 'red'],
  closed: ['พอร์ทัลถูกปิด', 'red'], pending: ['รออนุมัติ', 'blue'], rejected: ['ไม่อนุมัติ', 'red'], disabled: ['บัญชีถูกระงับ', 'red'], locked: ['ถูกล็อกชั่วคราว', 'red'] };
const POS = { cleaner: ['พนักงานทำความสะอาด', 'purple'], supervisor: ['หัวหน้าแม่บ้าน', 'violet'], manager: ['คณะกรรมการตรวจความสะอาด', 'blue'], admin: ['ผู้ดูแลระบบ (Super Admin)', 'gray'] };
const portalOff = r => (S.perms || {})[r]?.portal === false;

function peopleRows() {
  const last = u => `เข้าล่าสุด ${(u.lastLogin || '–').slice(0, 16)}`;
  // ชื่อ-นามสกุลซ้ำกัน (ไม่นับที่ไม่อนุมัติ) — ระบบแยกคนจากชื่อในหมายเหตุ/สถิติ จึงแสดง ID ที่ซ้ำให้ Admin ตัดสินใจ
  const nk = u => String(u.displayName || '').replace(/\s+/g, ' ').trim().toLowerCase(), byName = {};
  (S.users || []).filter(u => u.status !== 'rejected').forEach(u => { (byName[nk(u)] = byName[nk(u)] || []).push(u.username); });
  const rows = (S.users || []).map(u => {
    const cl = u.role === 'cleaner';
    const status = { pending: ['รออนุมัติ', 'blue'], rejected: ['ไม่อนุมัติ', 'red'], disabled: [cl ? 'พักงาน' : 'ระงับ', 'gray'],
      approved: portalOff(u.role) ? ['พอร์ทัลถูกปิด', 'red'] : [cl ? 'ปฏิบัติงาน' : 'ใช้งานได้', 'green'] }[u.status] || ['–', 'gray'];
    let info = `ลงทะเบียน ${(u.createdAt || '').slice(0, 10)} · ${last(u)}`;
    if (cl) info = `ทำงานเวียนทุกพื้นที่ · ${last(u)}`;
    if (u.role === 'supervisor') info = `ตรวจงานทุกพื้นที่ (${S.locs.length}) · ${last(u)}`;
    const dup = u.status !== 'rejected' ? (byName[nk(u)] || []).filter(x => x !== u.username) : [];
    if (dup.length) info = `⚠ ชื่อซ้ำกับ ID ${dup.join(', ')} · ` + info;
    return { role: u.role, name: u.displayName, sub: `ID ${u.username}${u.phone ? ' · ' + u.phone : ''}`, status, mustChange: u.mustChange, info, user: u };
  });
  rows.push({ role: 'admin', name: S.auth?.displayName || 'ผู้ดูแลระบบ', sub: S.auth?.user ? 'ID ' + S.auth.user : '', status: ['ใช้งานได้', 'green'], info: 'เข้าได้ทุกพอร์ทัล ไม่ถูกจำกัดสิทธิ์' });
  const rank = r => (r.user && r.user.status === 'pending' ? 0 : { admin: 1, manager: 2, supervisor: 3, cleaner: 4 }[r.role]);
  return rows.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'th'));
}

function vPerms() {
  const P = S.perms;
  if (!P || !S.users) return `<div class="empty"><span class="spin"></span></div>`;
  const all = peopleRows(), f = S.pplRole || 'all', rows = all.filter(r => f === 'all' || r.role === f);
  const b = (act, id, label, cls) => `<button class="btn sm ${cls || ''}" data-act="${act}" data-u="${esc(id)}">${label}</button>`;
  const acts = r => {
    const u = r.user; if (!u) return '<span class="muted">–</span>';
    const off = u.role === 'cleaner' ? 'พักงาน' : 'ระงับ', k = u.username;
    return ({ pending: b('userApprove', k, 'อนุมัติ') + b('userReject', k, 'ไม่อนุมัติ', 'ghost danger'),
      rejected: b('userApprove', k, 'อนุมัติ', 'ghost') + b('userDel', k, 'ลบ', 'ghost danger'),
      approved: b('userEdit', k, 'แก้ไข', 'ghost') + b('userReset', k, 'รีเซ็ตรหัสผ่าน', 'ghost') + b('userDisable', k, off, 'ghost danger'),
      disabled: b('userEnable', k, 'เปิดใช้งาน') + b('userReset', k, 'รีเซ็ตรหัสผ่าน', 'ghost') + b('userDel', k, 'ลบ', 'ghost danger') })[u.status] || '';
  };
  const count = Object.fromEntries(['cleaner', 'supervisor', 'manager', 'admin'].map(r => [r, all.filter(x => x.role === r)]));
  const flt = (k, label, n) => `<button class="${f === k ? 'on' : ''}" data-act="pplRole" data-r="${k}">${label} (${n})</button>`;
  const sw = (r, p) => `<button type="button" class="sw ${P[r]?.[p.key] !== false ? 'on' : ''}" role="switch" aria-checked="${P[r]?.[p.key] !== false}" aria-label="${esc(ROLES[r].name)}: ${esc(p.label)}" data-act="perm" data-role="${r}" data-key="${p.key}" ${S.permBusy ? 'disabled' : ''}></button>`;
  const card = r => {
    const L = count[r], lim = (S.limits || {})[r] || { used: L.length, max: 0 }, full = lim.used >= lim.max;
    const n = st => L.filter(x => x.user && x.user.status === st).length, pend = n('pending');
    return `<div class="card stat ${portalOff(r) ? 'role-off' : ''}">
      <div class="row"><span class="chip c-${POS[r][1]}">${POS[r][0]}</span><span class="chip c-${portalOff(r) ? 'red' : 'green'}">${portalOff(r) ? 'ปิดพอร์ทัล' : 'เปิดพอร์ทัล'}</span></div>
      <div class="v">${lim.used}<span class="sm muted"> / ${lim.max} คน</span>${full ? ' <span class="chip c-red">เต็ม</span>' : ''}</div>
      <div class="bar" style="margin:6px 0"><i class="${full ? 'full' : ''}" style="width:${lim.max ? Math.min(100, lim.used / lim.max * 100) : 0}%"></i></div>
      <div class="xs muted">ใช้งานได้ ${n('approved')}${n('disabled') ? ` · ${r === 'cleaner' ? 'พักงาน' : 'ระงับ'} ${n('disabled')}` : ''}${pend ? ` · <b style="color:var(--red)">รออนุมัติ ${pend}</b>` : ''} · ว่าง ${Math.max(0, lim.max - lim.used)}</div></div>`;
  };

  return `
  <div class="stack">
    <div class="row" style="flex-wrap:wrap">
      <div><h2>จัดการสิทธิ์การใช้งาน</h2><div class="sm muted">ดูตำแหน่งและสถานะของทุกคน · อนุมัติผู้ลงทะเบียน · กำหนดสิทธิ์ของแต่ละบทบาท (มีผลทันที) · Super Admin ไม่ถูกจำกัด</div></div>
      <button class="btn sm ghost danger no-print" data-act="permReset">คืนค่าเริ่มต้นสิทธิ์ทั้งหมด</button>
    </div>

    <div class="stats">${['cleaner', 'supervisor', 'manager'].map(card).join('')}</div>

    <div class="card tbl">
      <div class="row no-print" style="flex-wrap:wrap;margin-bottom:8px">
        <div class="tabs">${flt('all', 'ทั้งหมด', all.length)}${flt('cleaner', 'แม่บ้าน', count.cleaner.length)}${flt('supervisor', 'หัวหน้า', count.supervisor.length)}${flt('manager', 'กรรมการ', count.manager.length)}</div>
        <button class="btn sm primary" data-act="userCreate">+ สร้างบัญชี</button>
      </div>

async function setPerm(role, key, value) {
  if (S.permBusy) return;
  if (key === 'portal' && !value && !await askConfirm({ tone: 'danger', title: `ปิดพอร์ทัล${ROLES[role].name}?`, text: 'ผู้ใช้บทบาทนี้จะเข้าระบบไม่ได้ทันทีจนกว่าจะเปิดกลับ', ok: 'ปิดพอร์ทัล' })) return;
  S.permBusy = true; render();
  try { await api('apiSetPermission', S.auth.token, role, key, value); S.permBusy = false; await loadAdmin(); toast(`${value ? 'เปิด' : 'ปิด'}สิทธิ์แล้ว`); }
  catch (e) { S.permBusy = false; render(); toast(e.message, true); }
}

async function submitUserEdit(form) {
  if (!phoneOk(form.ph.value, false)) { formErr('#ueErr', PHONE_MSG); return form.ph.focus(); }
  const btn = $('button[type=submit]', form); btn.disabled = true;
  const p = { username: S.userEdit.username, displayName: form.n.value, phone: form.ph.value };
  try { await api('apiSaveUser', S.auth.token, p); closeModal(); await Promise.all([loadAdmin(), load(true)]); await askDone({ title: 'บันทึกข้อมูลแล้ว', text: p.displayName }); }
  catch (e) { btn.disabled = false; formErr('#ueErr', e.message); }
}

async function loadAdmin() {
  if (S.auth?.role !== 'admin' || S.view !== 'admin') return;
  try {
    const t = S.auth.token;
    const [d, ul, logs, pm] = await Promise.all([api('apiGetDashboard', t), api('apiListUsers', t), api('apiListLoginLogs', t), api('apiListPerms', t)]);
    S.hist = d.hist; S.users = ul.users; S.limits = ul.limits; S.logs = logs; S.perms = pm.perms; S.permLog = pm.log;
    if (S.view === 'admin') render();
  } catch (e) { toast(e.message, true); }
}

const stat = (t, v, sub, c) => `<div class="card stat"><div class="sm muted">${t}</div><div class="v" style="color:var(--${c === 'gray' ? 'text' : c})">${v}</div><div class="xs muted">${sub}</div></div>`;

/* ช่องเบอร์โทร: ตัวเลขล้วน 10 หลัก จัดรูปแบบ 000-000-0000 ให้อัตโนมัติ (data-act="phone") */
const phoneField = (val, required) => `<input type="tel" name="ph" inputmode="numeric" autocomplete="tel-national" maxlength="12" data-act="phone" placeholder="081-234-5678"
  pattern="${required ? '' : '(?:'}\\d{3}-\\d{3}-\\d{4}${required ? '' : ')?'}" title="ตัวเลข 10 หลัก รูปแบบ 000-000-0000" ${required ? 'required' : ''} value="${esc(val || '')}">`;
const fmtPhone = v => { const d = String(v).replace(/\D/g, '').slice(0, 10); return d.length > 6 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d; };
const phoneOk = (v, required) => (!v && !required) || /^\d{3}-\d{3}-\d{4}$/.test(v);
const PHONE_MSG = 'เบอร์โทรต้องเป็นตัวเลข 10 หลัก รูปแบบ 000-000-0000';

/* ---------- Modal: รายละเอียด + ดำเนินการ ---------- */
function mDetail() {
  const l = loc(S.openId); if (!l) return '';
  const p = prog(l);
  const role = S.view;
  const canClean = role === 'cleaner' && QUEUE.cleaner.includes(l.status);
  const reviewed = l.status === 'approved', canReview = role === 'supervisor' && (QUEUE.supervisor.includes(l.status) || reviewed) && (can('supervisor', 'approve') || can('supervisor', 'reject'));
  const canFeedback = role === 'manager' && can('manager', 'feedback');

  const zones = l.subZones.map(z => canClean
    ? `<button class="check ${z.completed ? 'on' : ''}" data-act="zone" data-zone="${z.id}"><span class="box">${z.completed ? ICONS.check : ''}</span><span>${esc(z.name)}</span></button>`
    : `<div class="check ro ${z.completed ? 'on' : 'off'}"><span class="box">${z.completed ? ICONS.check : ''}</span><span>${esc(z.name)}</span></div>`
  ).join('');

  const notes = [
    ['แม่บ้าน' + (sender(l) ? ' · ' + sender(l) : ''), l.cleanerNote], ['หัวหน้าแม่บ้าน', l.supervisorNote], ['คณะกรรมการ (แจ้งปรับปรุงล่าสุด)', l.managerNote],
  ].filter(n => n[1]).map(n => `<div class="note sm"><b class="b">${esc(n[0])}:</b> ${esc(n[1])}</div>`).join('');

  const photos = l.photos.length ? `
    <div class="sec"><h3 style="margin-bottom:8px">รูปภาพ (${l.photos.length})</h3>
      <div class="photos">${l.photos.map(photoThumb).join('')}</div></div>` : '';

  const history = l.history.length ? `
    <div class="sec"><h3 style="margin-bottom:6px">ประวัติวันนี้</h3>
      <div class="timeline">${l.history.slice().reverse().map(h => `<div><time>${esc(h.time)}</time><span><b class="b">${esc(h.user)}</b> ${esc(h.action)}</span></div>`).join('')}</div>
    </div>` : '';

  let action = '';
  if (canClean) action = `
    <div class="sec stack">
      ${l.status === 'rejected' ? `<div class="alert sm" style="margin:0">ต้องแก้ไข: ${esc(l.rejectNote)}</div>` : ''}
      <div><label class="lbl">รูปหลังทำความสะอาด (อย่างน้อย 1 รูป)</label>${photoPicker()}</div>
      <div><label class="lbl">หมายเหตุ (ถ้ามี)</label><textarea rows="2" data-act="note" placeholder="เช่น น้ำยาหมด, ก๊อกน้ำรั่ว">${esc(S.form.note || l.cleanerNote)}</textarea></div>
      <button class="btn primary block" data-act="submit" ${S.busy ? 'disabled' : ''}>ส่งรายงาน</button>
    </div>`;
  else if (canReview) action = `
    <div class="sec stack">
      ${reviewed ? '<div class="note sm">ตรวจผ่านไปแล้ว — แก้ไขผลตรวจได้ เช่น ตีกลับให้แก้ไข หรือบันทึกหมายเหตุ/รูปเพิ่มเติม</div>' : ''}
      <div><label class="lbl">แนบรูป (จำเป็นเมื่อพบจุดบกพร่อง)</label>${photoPicker()}</div>
      <div><label class="lbl">หมายเหตุ / จุดที่ต้องแก้ไข</label><textarea rows="2" data-act="note" placeholder="ระบุตำแหน่งและสิ่งที่ต้องแก้">${esc(S.form.note)}</textarea></div>
      <div class="row">
        ${can('supervisor', 'reject') ? `<button class="btn danger block" data-act="reject" ${S.busy ? 'disabled' : ''}>ตีกลับให้แก้ไข</button>` : ''}
        ${can('supervisor', 'approve') ? `<button class="btn primary block" data-act="approve" ${S.busy ? 'disabled' : ''}>${reviewed ? 'บันทึกตรวจผ่านอีกครั้ง' : 'ตรวจผ่าน (สิ้นสุดงาน)'}</button>` : ''}
      </div>
    </div>`;
  else if (canFeedback) action = `
    <div class="sec stack">
      <div class="note sm">คณะกรรมการไม่ต้องอนุมัติ — แจ้งจุดปรับปรุงได้ทุกเวลา งานไม่เปลี่ยนสถานะ หัวหน้าแม่บ้านและ Admin จะเห็นข้อเสนอแนะ</div>
      <div><label class="lbl">จุดที่ควรปรับปรุง</label><textarea rows="3" data-act="note" placeholder="ระบุตำแหน่งและสิ่งที่ควรปรับปรุง">${esc(S.form.note)}</textarea></div>
      <div><label class="lbl">แนบรูป (ไม่บังคับ)</label>${photoPicker()}</div>
      <div><label class="lbl">คะแนนความสะอาด (ไม่บังคับ · กดดาวเดิมซ้ำเพื่อล้าง)</label><div class="stars" id="stars">${starsHtml()}</div></div>
      <button class="btn primary block" data-act="feedback" ${S.busy ? 'disabled' : ''}>แจ้งจุดปรับปรุง</button>
    </div>`;
  else if (role !== 'admin') action = `<div class="sec sm muted">${role === 'manager' ? 'บทบาทนี้ถูกปิดสิทธิ์การแจ้งจุดปรับปรุง' : `ขั้นตอนนี้ไม่ต้องดำเนินการโดย${ROLES[role].name} (${STATUS[l.status].t})`}</div>`;

  return `
